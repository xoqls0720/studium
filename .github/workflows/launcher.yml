name: Studium desktop exe
on:
  push:
    paths: ["tools/launcher/**", ".github/workflows/launcher.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller pillow
      - name: Build
        shell: pwsh
        run: |
          python tools/launcher/icon.py icon-512.png tools/launcher/studium.ico
          cd tools/launcher
          pyinstaller --noconfirm --onefile --windowed --name Studium --icon studium.ico studium.py
      - name: Publish to studium-dist branch
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item tools/launcher/dist/Studium.exe out/
          cd out
          git init -b studium-dist
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -m "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" studium-dist
