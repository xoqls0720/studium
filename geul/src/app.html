<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="생각과 글">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" type="image/png" href="icon.png">
<title>생각과 글 · LEET·논리·심리·글쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
/*CSS*/
.flash .w{font-family:var(--font);font-size:2.2rem}
.hanja{color:var(--sub);font-size:1rem}
textarea{width:100%;min-height:42vh;font-family:var(--font);font-size:1.05rem;line-height:1.8;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#000;resize:vertical}
textarea.short{min-height:110px}
.passage{font-family:var(--font)} .q,.opt{font-family:var(--font)}
.tech{border-left:4px solid var(--line);padding:4px 0 4px 14px;margin:12px 0}
.tech b{display:block}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
details summary{cursor:pointer;font-weight:700}
.fb{white-space:pre-wrap}
.fb h4{margin:14px 0 4px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>생각과 글</h1><span class="chip" id="sync">저장 준비 중</span></div>
  <nav id="nav">
    <a href="#home">오늘</a><a href="#plan">플랜</a><a href="#words">개념어</a><a href="#logic">논리학</a><a href="#leet">LEET</a><a href="#psy">심리학</a><a href="#lib">서재</a><a href="#write">글쓰기</a><a href="#novel">소설</a><a href="#review">오답</a><a href="#stats">기록</a>
  </nav>
</header>
<main id="app"></main>
<script>
/*DATA*/
</script>
<script>
(function(){
"use strict";
const $app=document.getElementById("app");
const INT=[0,1,2,4,8,16,30,60], DAILY_NEW=15;
const N5=["①","②","③","④","⑤"];
function dayNum(d){d=d||new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)}
function dayStr(n){const d=new Date(n*86400000);return (d.getUTCMonth()+1)+"/"+d.getUTCDate()}
const TODAY=()=>dayNum();
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function $(id){return document.getElementById(id)}

// ================= 상태 =================
const BLANK=()=>({v:1,words:{},xw:[],wrong:{},done:{},logs:{},tags:{},drafts:[],stage:0,sets:[],gx:[],gxr:{},rd:{},rnote:{},papers:[],guides:[],novels:[],drills:{}});
let S=BLANK();
function fix(){const b=BLANK();for(const k in b)if(S[k]==null)S[k]=b[k]}
function log(){const k=TODAY();S.logs[k]=S.logs[k]||{w:0,q:0,c:0,m:0,ch:0};return S.logs[k]}
function streak(){let n=0,d=TODAY();if(!S.logs[d])d--;while(S.logs[d]&&(S.logs[d].w+S.logs[d].q+S.logs[d].ch)>0){n++;d--}return n}

// ================= 저장 =================
let ref=null,saving=false,dirty=false,timer=null,busy=false;
const LS="tb-geul-v1";
function setSync(t){$("sync").textContent=t}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
async function readRef(r){const s=await r.get();if(!s)return null;if(typeof s.data==="function"){return s.exists===false?null:s.data()}if(s.data!==undefined)return s.data;return s}
function save(){lsSet();dirty=true;clearTimeout(timer);timer=setTimeout(flush,1500)}
async function flush(){
  if(!ref||saving||!dirty)return;saving=true;dirty=false;setSync("저장 중…");
  try{await ref.set({json:JSON.stringify(S),updated:Date.now()});setSync("계정에 저장됨")}
  catch(e){setSync("저장 실패 · 이 기기에만 저장");dirty=true}
  saving=false;if(dirty)timer=setTimeout(flush,3000)}
function size(x){return x?Object.keys(x.logs||{}).length+Object.keys(x.words||{}).length+Object.keys(x.done||{}).length+(x.drafts||[]).length+(x.novels||[]).length+Object.keys(x.rd||{}).length:0}
async function claudeUse(n){try{if(!window.claude||!window.claude.use)return null;return await Promise.race([window.claude.use(n),new Promise(r=>setTimeout(()=>r(null),10000))])}catch(e){return null}}
async function initStore(){
  const l=lsGet();if(l)S=Object.assign(BLANK(),l);fix();setSync("이 기기에만 저장");route();
  try{
    const db=await claudeUse("db"),user=await claudeUse("user");if(!db||!user)return;
    const id=await user.id();if(!id)return;
    ref=db.collection("data/users/"+id).doc("geul");
    const got=await readRef(ref);
    if(got&&got.json){const remote=JSON.parse(got.json);
      if(size(remote)>=size(lsGet())){S=Object.assign(BLANK(),remote);fix();lsSet()}else{dirty=true;flush()}}
    else{dirty=true;flush()}
    setSync("계정에 저장됨");if(!busy)route();
  }catch(e){setSync("이 기기에만 저장")}
}
let lastAct=Date.now();
["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{if(!document.hidden&&Date.now()-lastAct<180000){log().m++;save()}},60000);

// ================= Claude =================
let sampleFn=null,sampleState="wait";
(async()=>{sampleFn=await claudeUse("sample");sampleState=sampleFn?"ok":"none";if(!busy)route()})();
async function ask(prompt,tier){
  if(!sampleFn)throw {code:"none"};
  try{return await sampleFn.json(prompt,{modelTier:tier||"complex"})}
  catch(e){if(e&&(e.code==="not_granted"||e.code==="rate_limited"))throw e;
    const r=await sampleFn(prompt+"\nJSON 외의 글자는 절대 쓰지 마.",{modelTier:tier||"complex"});
    const t=(r&&r.text||"").replace(/^[^{]*/,"").replace(/[^}]*$/,"");return JSON.parse(t)}
}
async function askText(prompt,tier){
  if(!sampleFn)throw {code:"none"};
  const r=await sampleFn(prompt,{modelTier:tier||"complex"});return (r&&r.text)||String(r||"")}
function genError(e){
  if(e&&e.code==="none")return "이 화면에서는 Claude 기능을 쓸 수 없어요. claude.ai에서 앱을 열면 돼요. 기본 문제와 개념어는 그대로 쓸 수 있어요.";
  if(e&&e.code==="not_granted")return "Claude 사용 허락이 꺼져 있어요. 앱을 다시 열고 허락하면 돼요.";
  if(e&&e.code==="rate_limited")return "잠깐 너무 많이 요청했어요. 1~2분 뒤에 다시 눌러 주세요.";
  if(e&&e.code==="empty")return "만들어진 문제가 형식에 맞지 않아 버렸어요. 한 번만 다시 눌러 주세요.";
  return "만들지 못했어요. 잠시 뒤 다시 눌러 주세요.";
}
function cleanItems(raw,src,tag){
  const arr=(raw&&raw.questions)||[];const out=[];
  arr.forEach(q=>{if(!q||!q.q||!Array.isArray(q.o)||q.o.length!==5)return;const a=+q.a;if(!(a>=0&&a<5))return;
    out.push({id:uid(),src,tag:q.type||tag||src,q:String(q.q),o:q.o.map(String),a,ex:String(q.ex||"")})});
  return out}

// ================= 공용 문제 풀이 =================
function runQuiz(items,opt){
  opt=opt||{};busy=true;let i=0,right=0;
  function finish(){busy=false;
    if(opt.unit){S.done[opt.unit]=Math.max(S.done[opt.unit]||0,Math.round(right/items.length*100))}
    save();
    $app.innerHTML=`<h2>${esc(opt.title||"문제")} 끝</h2><div class="card"><div class="big">${right} / ${items.length}</div>
     <p class="muted">틀린 문제는 오답에 모였어요. 오답은 '근거 문장'과 '내가 끌린 이유'를 함께 보는 게 핵심이에요.</p>
     <div class="row"><button class="btn" id="done">확인</button></div></div>`;
    $("done").onclick=()=>{opt.onDone?opt.onDone(right,items.length):route()}}
  function draw(){
    if(i>=items.length)return finish();
    const it=items[i];
    $app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(opt.title||"문제")}</h2><span class="muted">${i+1} / ${items.length}</span></div>
     <div class="bar" style="margin-bottom:16px"><i style="width:${i/items.length*100}%"></i></div>
     <div class="card"><div class="row" style="justify-content:space-between"><span class="pill">${esc(it.src)}${it.tag&&it.tag!==it.src?" · "+esc(it.tag):""}</span>${it.gen?`<button class="btn ghost sm" id="flag">이상한 문제예요</button>`:""}</div>
     ${it.passage?`<div class="passage">${esc(it.passage)}</div>`:""}
     <p class="q">${esc(it.q)}</p>
     <div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${N5[k]} ${esc(o)}</button>`).join("")}</div>
     <div id="ex"></div></div>`;
    if($("flag"))$("flag").onclick=()=>{delete S.wrong[it.id];save();i++;draw()};
    $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if($app.querySelector(".opt.ok"))return;
      const k=+b.dataset.k,ok=k===it.a;
      $app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.k===it.a)o.classList.add("ok")});
      if(!ok)b.classList.add("no");
      const lg=log();lg.q++;if(ok)lg.c++;
      const tg=S.tags[it.tag]||{c:0,w:0};ok?tg.c++:tg.w++;S.tags[it.tag]=tg;
      if(ok){right++;if(opt.mode==="review")delete S.wrong[it.id]}
      else{const w=S.wrong[it.id]||{n:0};w.n++;w.t=TODAY();w.why=w.why||"";
        w.item={id:it.id,src:it.src,tag:it.tag,q:it.q,o:it.o,a:it.a,ex:it.ex,passage:it.passage?it.passage.slice(0,3000):undefined};
        S.wrong[it.id]=w;trimWrong()}
      save();
      $("ex").innerHTML=`<div class="ex"><strong>${ok?"맞았어요.":"틀렸어요. 정답은 "+N5[it.a]+"."}</strong>\n${esc(it.ex)}</div>
       ${ok?"":`<p class="muted" style="margin:12px 0 4px">내가 ${N5[k]}에 끌린 이유 한 줄 (오답노트에 함께 저장돼요)</p><textarea class="short" id="why" placeholder="예: '대부분'을 '모두'로 읽었다"></textarea>`}
       <div class="row" style="margin-top:14px"><button class="btn" id="next">${i+1<items.length?"다음":"결과 보기"}</button></div>`;
      $("next").onclick=()=>{const w=$("why");if(w&&w.value.trim()&&S.wrong[it.id]){S.wrong[it.id].why=w.value.trim();save()}i++;draw();window.scrollTo(0,0)};
    });
  }
  draw();
}
function trimWrong(){const ks=Object.keys(S.wrong);if(ks.length>300){ks.sort((a,b)=>S.wrong[a].t-S.wrong[b].t).slice(0,ks.length-300).forEach(k=>delete S.wrong[k])}}
function unitItems(u,src){return u.q.map((q,n)=>({id:u.id+"-"+n,src,tag:u.title,q:q[0],o:q[1],a:q[2],ex:q[3]}))}

// ================= 개념어 =================
function allWords(){return WORDS.concat(S.xw)}
function wq(){
  const t=TODAY(),ws=allWords(),due=[],fresh=[];
  ws.forEach((w,i)=>{const s=S.words[i];if(!s)fresh.push(i);else if(s.d<=t)due.push(i)});
  const newToday=Object.values(S.words).filter(s=>s.f===t).length;
  return {due,fresh:fresh.slice(0,Math.max(0,DAILY_NEW-newToday)),total:ws.length,known:Object.values(S.words).filter(s=>s.l>=3).length}}
function viewWords(){
  const q=wq(),cats={};allWords().forEach((w,i)=>{const c=w[5]||"내가 넣은 말";(cats[c]=cats[c]||[]).push(i)});
  $app.innerHTML=`<h2>개념어 · 논리 어휘</h2>
   <div class="grid"><div class="card"><div class="muted">오늘 복습</div><div class="big">${q.due.length}</div></div>
   <div class="card"><div class="muted">오늘 새 낱말</div><div class="big">${q.fresh.length}</div></div>
   <div class="card"><div class="muted">익힌 낱말</div><div class="big">${q.known} / ${q.total}</div></div></div>
   <div class="row" style="margin:16px 0"><button class="btn" id="go"${q.due.length+q.fresh.length?"":" disabled"}>카드 시작</button><button class="btn ghost" id="use">문장 만들기 연습</button></div>
   <p class="muted">뜻을 외우는 것보다 '헷갈리는 짝'과 함께 기억하는 게 LEET·논술에서 점수가 돼요. 카드 뒷면에서 꼭 확인하세요.</p>
   <div class="card"><h3>낱말 더하기</h3><p class="muted">책이나 지문에서 막힌 말을 넣으면 Claude가 뜻·예문·헷갈리는 짝을 채워요.</p>
   <div class="row"><input id="nw" placeholder="예: 정언명령" style="flex:1"><button class="btn" id="add">넣기</button></div><div id="am" class="muted"></div></div>
   <div class="sep"></div>${Object.entries(cats).map(([c,ix])=>`<details><summary>${esc(c)} <span class="muted">${ix.length}</span></summary>
   ${ix.map(i=>{const w=allWords()[i];return `<div class="tech"><b>${esc(w[0])} <span class="hanja">${w[1]!=="—"?esc(w[1]):""}</span></b>${esc(w[2])}<div class="muted">${esc(w[4])}</div></div>`}).join("")}</details>`).join("")}`;
  $("go").onclick=()=>wordSession(shuffle(q.due).concat(q.fresh));
  $("use").onclick=useWords;
  $("add").onclick=async()=>{const v=$("nw").value.trim();if(!v)return;$("am").textContent="뜻을 찾는 중…";
    try{const r=await ask(`한국어 개념어 학습 카드를 만들어. 낱말: "${v}". 대학 신입생이 논리적 글쓰기와 LEET 지문을 읽을 때 필요한 뜻으로.
JSON: {"w":"낱말","h":"한자나 원어, 없으면 —","m":"쉬운 뜻 한 문장","e":"이 낱말이 들어간 자연스러운 예문 하나","p":"헷갈리는 짝이나 쓰임 주의 한 문장"}`,"default");
      if(!r||!r.m)throw {code:"empty"};S.xw.push([r.w||v,r.h||"—",r.m,r.e||"",r.p||"","내가 넣은 말"]);save();viewWords()}
    catch(e){$("am").textContent=genError(e)}};
}
function wordSession(queue){
  busy=true;let i=0;const ws=allWords();
  function draw(){
    if(i>=queue.length){busy=false;$app.innerHTML=`<h2>오늘 카드 끝</h2><div class="card"><p>${queue.length}장을 넘겼어요. 내일 다시 나올 카드는 알아서 골라 둘게요.</p><div class="row"><button class="btn" id="b">확인</button><button class="btn ghost" id="u">문장 만들기로</button></div></div>`;$("b").onclick=()=>{location.hash="#home";route()};$("u").onclick=useWords;return}
    const idx=queue[i],w=ws[idx];
    $app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>개념어</h2><span class="muted">${i+1} / ${queue.length}</span></div>
     <div class="card flash"><span class="pill">${esc(w[5]||"")}</span><div class="w">${esc(w[0])}</div><div class="hanja">${w[1]!=="—"?esc(w[1]):""}</div>
     <p class="muted">뜻을 먼저 떠올려 말해 보고 뒤집으세요.</p><button class="btn" id="flip">뜻 보기</button><div id="back" hidden style="text-align:left;width:100%">
     <div class="ex"><b>${esc(w[2])}</b>\n\n예) ${esc(w[3])}\n\n짝·주의: ${esc(w[4])}</div>
     <div class="row" style="justify-content:center;margin-top:14px"><button class="btn bad" data-r="0">몰랐다</button><button class="btn ghost" data-r="1">애매했다</button><button class="btn good" data-r="2">알았다</button></div></div></div>`;
    $("flip").onclick=()=>{$("back").hidden=false;$("flip").hidden=true};
    $app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
      const r=+b.dataset.r,t=TODAY(),s=S.words[idx]||{l:0,f:t};
      s.l=r===0?0:r===1?Math.max(1,s.l):Math.min(INT.length-1,s.l+1);s.d=t+(r===0?0:INT[s.l]);S.words[idx]=s;
      log().w++;save();if(r===0)queue.push(idx);i++;draw()});
  }
  draw();
}
function useWords(){
  busy=true;const ws=allWords(),learned=Object.keys(S.words).map(Number).filter(i=>ws[i]);
  const pick=shuffle(learned.length>=3?learned:ws.map((_,i)=>i)).slice(0,3);
  $app.innerHTML=`<h2>문장 만들기</h2><div class="card"><p>아래 세 낱말을 <b>모두</b> 써서 두세 문장을 지어 보세요. 주제는 자유 — 오늘 있었던 일이어도 좋아요.</p>
   <div class="row">${pick.map(i=>`<span class="pill">${esc(ws[i][0])}</span>`).join("")}</div>
   <textarea class="short" id="t" style="margin-top:12px" placeholder="예: 그럼에도 …"></textarea>
   <div class="row" style="margin-top:10px"><button class="btn" id="c">Claude에게 봐 달라기</button><button class="btn ghost" id="o">다른 낱말</button></div><div id="fb"></div></div>`;
  $("o").onclick=useWords;
  $("c").onclick=async()=>{const t=$("t").value.trim();if(t.length<10)return;$("fb").innerHTML=`<p class="muted">읽는 중…</p>`;
    try{const r=await askText(`대학 신입생이 개념어 연습으로 쓴 문장이야. 낱말: ${pick.map(i=>ws[i][0]).join(", ")}.
문장: """${t}"""
낱말마다 ① 뜻에 맞게 썼는지(맞음/어긋남) ② 어긋났다면 왜, 고친 문장 하나. 마지막에 문장 흐름에 대한 한 줄. 짧게, 존댓말(해요체)로, 마크다운 기호 없이.`,"default");
      $("fb").innerHTML=`<div class="ex fb">${esc(r)}</div>`;log().ch++;save()}catch(e){$("fb").innerHTML=`<p class="muted">${esc(genError(e))}</p>`}};
}

// ================= 논리학 · 심리학 단원 =================
function viewUnits(list,key,title,intro){
  $app.innerHTML=`<h2>${title}</h2><p class="muted">${intro}</p><div class="list">${list.map((u,n)=>{const d=S.done[u.id];
   return `<a class="item" href="#${key}/${u.id}"><span>${n+1}. ${esc(u.title)}</span>${d==null?`<span class="pill w">아직</span>`:d>=80?`<span class="pill g">${d}점</span>`:`<span class="pill b">${d}점</span>`}</a>`}).join("")}</div>`}
function viewUnit(list,key,id,src){
  const u=list.find(x=>x.id===id);if(!u){location.hash="#"+key;return}
  $app.innerHTML=`<p><a href="#${key}">← ${src} 목록</a></p><h2>${esc(u.title)}</h2>
   <div class="card"><p>${esc(u.sum)}</p><ul class="pts">${u.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
   ${u.use?`<div class="ex"><b>글쓰기에 쓰는 법</b>\n${esc(u.use)}</div>`:""}</div>
   <div class="row" style="margin:16px 0"><button class="btn" id="qz">확인 문제 ${u.q.length}개</button><button class="btn ghost" id="more">비슷한 문제 더 만들기</button></div><div id="m" class="muted"></div>`;
  $("qz").onclick=()=>runQuiz(unitItems(u,src),{title:u.title,unit:u.id,onDone:()=>{location.hash="#"+key+"/"+u.id;route()}});
  $("more").onclick=async()=>{$("m").textContent="Claude가 문제를 만드는 중이에요…";

const GX_AREA={"언어이해":{min:70,n:30},"추리논증":{min:125,n:40}};
let pdfLib=null;
function loadPdfJs(){if(pdfLib)return Promise.resolve(pdfLib);
  return new Promise((ok,no)=>{const s=document.createElement("script");s.src="pdf.min.js";
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js";pdfLib=window.pdfjsLib;ok(pdfLib)}catch(e){no(e)}};
    s.onerror=()=>no(new Error("pdf.js를 불러오지 못했어요"));document.head.appendChild(s)})}
// 쪽 이미지는 이 기기(IndexedDB)에만
function idb(){return new Promise((ok,no)=>{try{const r=indexedDB.open("geul-gx",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
async function imgPut(k,v){try{const d=await idb();await new Promise(ok=>{const t=d.transaction("img","readwrite");t.objectStore("img").put(v,k);t.oncomplete=ok;t.onerror=ok})}catch(e){}}
async function imgGet(k){try{const d=await idb();return await new Promise(ok=>{const r=d.transaction("img").objectStore("img").get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}catch(e){return null}}
// 두 단 편집을 고려해 쪽마다 글줄을 읽는 순서대로 모은다
async function pageLines(page){
  const vp=page.getViewport({scale:1}),W=vp.width,tc=await page.getTextContent();
  const its=tc.items.filter(t=>t.str).map(t=>({s:t.str,x:t.transform[4],y:t.transform[5],w:t.width||0}));
  const right=its.filter(t=>t.x>W*0.52).length, twoCol=right>its.length*0.25;
  const col=t=>twoCol&&t.x>W*0.5?1:0;
  its.sort((a,b)=>col(a)-col(b)||b.y-a.y||a.x-b.x);
  const lines=[];let cur=null;
  its.forEach(t=>{if(cur&&cur.c===col(t)&&Math.abs(cur.y-t.y)<3){cur.s+=(t.x-cur.ex>1.5&&!/\s$/.test(cur.s)?" ":"")+t.s;cur.ex=t.x+t.w}
    else if(t.s.trim()){cur={c:col(t),y:t.y,s:t.s,ex:t.x+t.w};lines.push(cur)}});
  return lines.map(l=>l.s.replace(/\s+/g," ").trim()).filter(l=>l&&!/^-?\s*\d+\s*-?$/.test(l)&&!/^(언어이해|추리논증)\s*영역/.test(l)&&!/^\d+\s*\/\s*\d+$/.test(l))}
async function readPdf(file,onp,imgKey){
  const lib=await loadPdfJs(),doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){onp&&onp(i,doc.numPages);const pg=await doc.getPage(i);pages.push(await pageLines(pg));
    if(imgKey){try{const vp=pg.getViewport({scale:1.6}),cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
      await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;await imgPut(imgKey+":"+i,cv.toDataURL("image/jpeg",.8))}catch(e){}}}
  return pages}
const CIR="①②③④⑤";
function parseExam(pages,N){
  const items=[],passages={};let exp=1,cur=null,grp=null,mode=null;
  pages.forEach((ls,pi)=>ls.forEach(l=>{
    const g=l.match(/^\[\s*(\d{1,2})\s*[～~∼〜\-–]\s*(\d{1,2})\s*\]\s*(.*)$/);
    if(g&&+g[1]===exp){grp=g[1]+"~"+g[2];passages[grp]={a:+g[1],b:+g[2],t:g[3]?g[3]+"\n":"",pg:pi+1};mode="p";cur=null;return}
    const m=l.match(/^(\d{1,2})\s*\.\s*(.*)$/);
    if(m&&+m[1]===exp&&exp<=N){cur={n:exp,raw:m[2]+"\n",pg:pi+1,grp:(grp&&passages[grp].b>=exp)?grp:null};items.push(cur);exp++;mode="q";return}
    if(mode==="p"&&grp)passages[grp].t+=l+"\n";else if(cur)cur.raw+=l+"\n"}));
  items.forEach(it=>{const r=it.raw,i1=r.indexOf("①");
    if(i1<0){it.q=r.trim();it.o=null;return}
    it.q=r.slice(0,i1).trim();const os=[];let rest=r.slice(i1);
    for(let k=0;k<5;k++){const s=rest.indexOf(CIR[k]);if(s<0)break;const e=k<4?rest.indexOf(CIR[k+1],s+1):-1;os.push(rest.slice(s+1,e<0?undefined:e).replace(/\s+/g," ").trim());if(e<0)break;rest=rest.slice(e)}
    it.o=os.length===5?os:null;delete it.raw;if(!it.o)it.bad=r.trim()});
  const flow=s=>s.trim().split("\n").reduce((o,l)=>o+(o&&!/\n$/.test(o)?" ":"")+l+(/[다요까]\.$|[.?!]$/.test(l)?"\n":""),"").trim();
  Object.values(passages).forEach(p=>p.t=flow(p.t));items.forEach(it=>{if(it.q)it.q=flow(it.q)});
  return {items,passages}}
function parseAnswers(pages,N){
  const t=pages.flat().join(" ");let seq=(t.match(/[①②③④⑤]/g)||[]).map(c=>CIR.indexOf(c));
  if(seq.length<N){const m=t.replace(/\d+\s*번/g," ").match(/(?:^|\s)[1-5](?=\s|$)/g)||[];if(m.length>=N*2){const nums=m.map(x=>+x.trim());seq=[]}}
  return seq.length>=N?seq.slice(0,N):[]}

function feedbackPrompt(kind,d){
  const voice=`이 학생의 문체 원칙(지켜야 할 것): 끊지 않고 길게 이어지는 흐르는 문장, 일상의 쉬운 말, '명제 → 반문 → 하지만 → 바람'의 흐름, "~이지 않을까", "~라고 생각한다" 같은 낮게 가라앉은 확신, 감정은 직접 설명하지 않고 행간으로, 명령문·당위·과장된 긍정·상투적 교훈 피하기, '바라본다/둔다/남겨둔다' 반복 금지, 장면에서 시작해 여운으로 맺기. 이 문체를 바꾸라고 하지 말고 이 문체 안에서 더 좋아지게 짚어.`;
  const head=`대학 신입생의 ${KINDS[kind][0]}을 첨삭해. 냉정하고 정확하게, 칭찬은 한 줄만. 해요체, 마크다운 기호(#, *, -) 없이 소제목은 【 】로.
과제: ${d.p}
${d.cl?"학생의 한 줄 주장: "+d.cl+"\n":""}글:
"""${d.t}"""
`;
  if(kind==="lit")return head+voice+`
【한 줄 평】
【장면과 행간】 감정을 직접 말한 문장을 찾아 사물·동작으로 바꾼 예를 하나씩.
【상투 표현】 닳은 비유·표현을 짚고 이 글에만 있을 법한 구체로 바꾼 예.
【반복과 어휘】 반복되는 낱말과 더 정확한 낱말.
【흐름】 문단 순서, 처음과 끝이 서로 답하는지, 여운이 남는지.
【고쳐 쓴 한 문단】 가장 약한 문단 하나를 학생의 문체를 지키며 고쳐 쓴 예.`;
  return head+(kind==="leet"?"LEET 논술 채점 기준(요구한 동사 이행, 제시문 재진술의 정확성, 적용의 정확성, 견해의 논증)으로 봐.\n":"")+voice+`
【한 줄 평】
【주장】 주장이 한 문장으로 분명한지, 과제가 묻는 것에 답했는지.
【근거와 논리】 근거의 종류(사실·원리·사례), 빠진 숨은 전제, 논리 오류(이름을 붙여서).
【반론 처리】 예상 반론을 공정하게 다루고 넘어섰는지, 없다면 넣을 반론 하나.
【문단 구성】 문단마다 소주제문, 접속어가 논리 관계와 맞는지.
【반복과 어휘】 반복되는 낱말과 더 정확한 개념어.
【고쳐 쓴 한 문단】 가장 약한 문단 하나를 학생의 문체를 지키며 고쳐 쓴 예.`;
}

    $app.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const k=+b.dataset.up;if(k>0){[n.scenes[k-1],n.scenes[k]]=[n.scenes[k],n.scenes[k-1]];save();novelEdit(id,"scenes")}});
    $("sug").onclick=()=>ai($("sf"),`이 소설의 다음 장면 아이디어 3가지를 서로 다른 방향으로 제안해. 각각 【제목】 원하는 것 / 막는 것 / 뒤집힘 / 끝에서 달라지는 것 / 심을 사물. 작가가 고를 수 있게 짧게. 해요체, 마크다운 기호 없이.\n${brief()}`);
    $("chk").onclick=()=>ai($("cf"),`장면 목록을 보고 장면 사이가 '그리고'(나열)인지 '그래서·때문에'(인과)인지 하나씩 판정하고, 나열인 곳은 인과로 바꾸는 방법을 한 줄씩. 빠진 장면이 있으면 하나만. 해요체, 마크다운 기호 없이.\n${brief()}`);
  }
  if(tab==="draft"){
    const ci=Math.min(n.ci||0,n.ch.length-1),c=n.ch[ci];
    $app.innerHTML=head+`<div class="seg" style="margin-bottom:8px">${n.ch.map((x,k)=>`<button data-c="${k}" class="${k===ci?"on":""}">${esc(x.name)}</button>`).join("")}<button id="nc">+ 장</button></div>
     <input id="cn" value="${esc(c.name)}" style="width:100%;margin-bottom:8px">
     <textarea id="t" placeholder="여기에 써요. 자동 저장돼요.">${esc(c.t)}</textarea>
     <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted" id="cnt"></span><span class="row"><button class="btn ghost" id="pdf">원고 PDF</button><button class="btn ghost" id="pov">한 문단 다른 시점으로</button><button class="btn" id="fbb">첨삭</button></span></div>
     <div id="fb">${c.fb?`<div class="ex fb">${esc(c.fb)}</div>`:""}</div>`;
    const ta=$("t"),cnt=()=>{$("cnt").textContent=`이 장 ${ta.value.length.toLocaleString()}자 · 전체 ${n.ch.reduce((s,x)=>s+(x===c?ta.value.length:x.t.length),0).toLocaleString()}자`};cnt();
    ta.oninput=()=>{c.t=ta.value;cnt();keep()};$("cn").oninput=e=>{c.name=e.target.value;keep()};
    $app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{n.ci=+b.dataset.c;save();novelEdit(id,"draft")});
    $("nc").onclick=()=>{n.ch.push({id:uid(),name:(n.ch.length+1)+"장",t:"",fb:""});n.ci=n.ch.length-1;save();novelEdit(id,"draft")};
    $("fbb").onclick=async()=>{if(ta.value.trim().length<200){$("fb").innerHTML=`<p class="muted">200자 넘게 쓰면 첨삭할 수 있어요.</p>`;return}
      const v=await ai($("fb"),`소설 원고 한 장을 냉정하게 첨삭해. 칭찬은 한 줄. 해요체, 마크다운 기호 없이, 【 】 소제목.
${VOICE}
【한 줄 평】
【장면의 힘】 인물의 욕망·장애·변화가 이 장에서 보이는지
【보여 주기】 감정을 직접 말한 문장 → 사물·동작으로 바꾼 예
【대사】 인물마다 말투가 구별되는지, 설명하는 대사가 있는지
【시점과 거리】 시점이 흔들린 곳
【반복과 어휘】
【고쳐 쓴 한 문단】 가장 약한 문단 하나를 작가 문체로
작품 정보:\n${brief()}\n\n원고(${c.name}):\n"""${ta.value.slice(0,20000)}"""`);if(v){c.fb=v.trim();save()}};
    $("pov").onclick=()=>{const sel=ta.value.slice(ta.selectionStart,ta.selectionEnd).trim()||ta.value.split(/\n\s*\n/).filter(Boolean).pop()||"";if(sel.length<40){$("fb").innerHTML=`<p class="muted">바꿔 볼 문단을 드래그해서 고르세요.</p>`;return}
      ai($("fb"),`아래 문단을 두 가지로 다시 써 줘: 【1인칭】 인물의 안에서, 【3인칭 관찰자】 밖에서 보이는 것만으로. 원래 문체(길게 흐르는 문장, 감정은 행간으로)를 지키고, 끝에 【차이】 무엇이 보이고 무엇이 숨는지 두 줄. 마크다운 기호 없이.\n"""${sel}"""`)};
    $("pdf").onclick=async()=>{const box=document.createElement("div");box.innerHTML=`<h1>${esc(n.title||"제목 없음")}</h1>${n.ch.map(x=>`<h2>${esc(x.name)}</h2>${x.t.split(/\n+/).map(l=>`<p>${esc(l)}</p>`).join("")}`).join("")}`;
      $("pdf").textContent="만드는 중…";try{await deliver(await makePdf(box),(n.title||"원고")+".pdf",$("pdf").parentNode)}catch(e){}$("pdf").textContent="원고 PDF"};
  }
}
function viewDrill(){busy=true;
  const k=(S.dk==null?TODAY():S.dk)%DRILLS.length,dr=DRILLS[k],key="d"+TODAY()+"-"+k,prev=(S.drills||{})[key]||{t:"",fb:""};
  $app.innerHTML=`<p><a href="#novel">← 소설 작업실</a></p><h2>문장 연습 · ${esc(dr[0])}</h2><div class="card"><p>${esc(dr[1])}</p><div class="row"><button class="btn ghost sm" id="ot">다른 연습</button></div></div>
   <textarea id="t" style="min-height:30vh" placeholder="여기에 써요.">${esc(prev.t)}</textarea>
   <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted" id="cnt"></span><button class="btn" id="fbb">봐 달라기</button></div><div id="fb">${prev.fb?`<div class="ex fb">${esc(prev.fb)}</div>`:""}</div>
   ${Object.keys(S.drills||{}).length?`<p class="muted" style="margin-top:12px">지금까지 연습 ${Object.keys(S.drills).length}편</p>`:""}`;
  const ta=$("t"),cnt=()=>$("cnt").textContent=ta.value.length+"자";cnt();
  const keep=()=>{S.drills=S.drills||{};S.drills[key]={t:ta.value,fb:prev.fb,k};save()};
  ta.oninput=()=>{cnt();clearTimeout(ta._t);ta._t=setTimeout(keep,800)};
  $("ot").onclick=()=>{S.dk=(k+1);save();viewDrill()};
  $("fbb").onclick=async()=>{if(ta.value.trim().length<60)return;$("fb").innerHTML=`<p class="muted">읽는 중…</p>`;
    try{const v=await askText(`문장 연습 과제 '${dr[0]}': ${dr[1]}\n학생 글:\n"""${ta.value}"""\n과제 규칙을 지켰는지(어긴 곳 짚기), 가장 좋은 문장 하나와 이유, 가장 약한 문장을 고친 예 하나. 학생 문체(길게 흐르는 문장, 감정은 행간으로)를 지키는 방향으로. 해요체, 마크다운 기호 없이, 짧게.`,"default");
      prev.fb=v.trim();keep();$("fb").innerHTML=`<div class="ex fb">${esc(prev.fb)}</div>`;log().ch++;save()}catch(e){$("fb").innerHTML=`<p class="muted">${esc(genError(e))}</p>`}};
}

// ================= 오답 =================
function viewReview(){
  const ws=Object.values(S.wrong).sort((a,b)=>b.t-a.t);
  $app.innerHTML=`<h2>오답 ${ws.length}</h2><p class="muted">LEET 오답은 '정답 근거 문장'과 '내가 끌린 이유'를 함께 봐야 같은 함정에 다시 안 빠져요.</p>
   <div class="row" style="margin:12px 0"><button class="btn" id="go"${ws.length?"":" disabled"}>오답 다시 풀기 (최대 10)</button><button class="btn ghost" id="pdf"${ws.length?"":" disabled"}>오답노트 PDF</button></div>
   <div class="list">${ws.slice(0,40).map(w=>`<details><summary>${esc(w.item.src)} · ${esc(w.item.tag||"")} <span class="muted">${w.n}번 틀림</span></summary><p>${esc(w.item.q.slice(0,300))}</p><div class="ex">정답 ${N5[w.item.a]} ${esc(w.item.o[w.item.a])}\n${esc(w.item.ex)}${w.why?"\n\n내가 끌린 이유: "+esc(w.why):""}</div></details>`).join("")}</div>`;
  $("go").onclick=()=>runQuiz(shuffle(ws).slice(0,10).map(w=>Object.assign({},w.item)),{title:"오답 다시",mode:"review"});
  $("pdf").onclick=async()=>{const box=document.createElement("div");box.innerHTML=`<h1>오답노트</h1>${ws.slice(0,40).map((w,n)=>`<h2>${n+1}. ${esc(w.item.src)} · ${esc(w.item.tag||"")}</h2><p>${esc(w.item.q)}</p><ul>${w.item.o.map((o,k)=>`<li>${N5[k]} ${esc(o)}</li>`).join("")}</ul><p>정답 ${N5[w.item.a]} — ${esc(w.item.ex)}</p>${w.why?`<p>내가 끌린 이유: ${esc(w.why)}</p>`:""}`).join("")}`;
    $("pdf").textContent="만드는 중…";try{await deliver(await makePdf(box),"오답노트.pdf",$("pdf").parentNode)}catch(e){}$("pdf").textContent="오답노트 PDF"};
}

// ================= 플랜 =================
function viewPlan(){
  $app.innerHTML=`<h2>플랜</h2><p class="muted">지금 단계를 눌러 두면 '오늘' 화면이 그 단계에 맞춰져요.</p>
   ${STAGES_G.map((s,n)=>`<div class="card stage${n===S.stage?" now":n<S.stage?" done":""}" style="margin:12px 0"><div class="row" style="justify-content:space-between"><h3>${esc(s.name)} <span class="muted">${esc(s.weeks)}</span></h3>${n===S.stage?`<span class="pill">지금</span>`:`<button class="btn ghost sm" data-s="${n}">이 단계로</button>`}</div>
   <b>할 것</b><ul class="pts">${s.todo.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><b>지금은 안 해도 되는 것</b><ul class="pts">${s.skip.map(x=>`<li class="muted">${esc(x)}</li>`).join("")}</ul></div>`).join("")}
   <div class="card"><h3>공부 원리 세 가지</h3><ul class="pts"><li>읽기보다 꺼내기 — 개념어 카드와 확인 문제가 다시 읽기보다 오래 남아요.</li><li>나눠서 자주 — 하루 몰아서보다 매일 30분이 나아요(간격 반복).</li><li>섞어서 — 추리논증은 유형을 섞어 풀어야 실전에서 유형을 알아봐요.</li></ul></div>`;
  $app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.stage=+b.dataset.s;save();viewPlan()});
}

// ================= 오늘 =================
function nextUnit(list){return list.find(u=>!(S.done[u.id]>=80))}
function viewHome(){
  const q=wq(),lg=S.logs[TODAY()]||{w:0,q:0,c:0,m:0,ch:0},st=STAGES_G[S.stage];
  const lu=nextUnit(LOGIC),pu=nextUnit(PSY),wk=Object.values(S.drafts).filter(d=>d.d>TODAY()-7).length;
  const tasks=[];
  tasks.push([`개념어 카드 ${q.due.length+q.fresh.length}장`,"#words",q.due.length+q.fresh.length===0]);
  if(S.stage===0){if(lu)tasks.push([`논리학 · ${lu.title}`,"#logic/"+lu.id,false]);if(pu)tasks.push([`심리학 · ${pu.title}`,"#psy/"+pu.id,false])}
  if(S.stage>=1)tasks.push(["언어이해 지문 1세트(문단 요약 쓰며)","#leet",false],["추리논증 유형 3문제","#leet",false]);
  if(S.stage===2)tasks.push(["LEET 논술 한 편","#write/leet",false]);
  {const nr=READS.find(r=>!(S.rd||{})[r.id]);if(nr)tasks.push([`서재 · ${nr.t} (${nr.a})`,"#lib/"+nr.id,false])}
  tasks.push(["문장 연습 한 편","#novel/drill",!!Object.keys(S.drills||{}).find(k=>k.startsWith("d"+TODAY()+"-"))]);
  tasks.push([wk>=2?"이번 주 글 "+wk+"편 썼어요":"이번 주 글 "+wk+"편 — 한 편 더",wk%2?"#write/lit":"#write/logic",wk>=2]);
  $app.innerHTML=`<h2>오늘</h2><p class="muted">${esc(st.name)} · ${streak()}일째 이어서 공부 중</p>
   <div class="grid"><div class="card"><div class="muted">오늘 카드</div><div class="big">${lg.w}</div></div><div class="card"><div class="muted">오늘 문제</div><div class="big">${lg.c}/${lg.q}</div></div><div class="card"><div class="muted">오늘 공부 시간</div><div class="big">${lg.m}분</div></div></div>
   <h3 style="margin-top:20px">오늘 할 것</h3><div class="list">${tasks.map(t=>`<a class="item" href="${t[1]}"><span>${esc(t[0])}</span>${t[2]?`<span class="pill g">됨</span>`:`<span class="pill">하기</span>`}</a>`).join("")}</div>
   ${sampleState==="none"?`<p class="muted" style="margin-top:14px">지금은 Claude 기능(문제 생성·첨삭)을 쓸 수 없는 화면이에요. claude.ai에서 열면 돼요.</p>`:""}`;
}

// ================= 기록 =================
function viewStats(){
  const days=[];for(let k=13;k>=0;k--){const d=TODAY()-k;days.push([dayStr(d),S.logs[d]||{w:0,q:0,c:0,m:0,ch:0}])}
  const mx=Math.max(1,...days.map(d=>d[1].m));
  const tags=Object.entries(S.tags).filter(([t,v])=>v.c+v.w>=3).map(([t,v])=>[t,Math.round(v.c/(v.c+v.w)*100),v.c+v.w]).sort((a,b)=>a[1]-b[1]);
  $app.innerHTML=`<h2>기록</h2><div class="card"><h3>최근 2주 공부 시간</h3>
   <svg viewBox="0 0 700 180" role="img" aria-label="최근 2주 공부 시간">${days.map((d,k)=>{const h=Math.round(d[1].m/mx*120);return `<rect x="${k*50+8}" y="${140-h}" width="34" height="${h}" fill="#1d5a66"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" type="image/png" href="icon.png">
<title>${d[0]} ${d[1].m}분</title></rect><text x="${k*50+25}" y="160" text-anchor="middle">${d[0]}</text>${d[1].m?`<text x="${k*50+25}" y="${134-h}" text-anchor="middle">${d[1].m}</text>`:""}`}).join("")}</svg></div>
   <div class="card" style="margin-top:12px"><h3>유형별 정답률 (낮은 순)</h3>${tags.length?`<table><tr><th>유형</th><th>정답률</th><th>푼 수</th></tr>${tags.map(t=>`<tr><td>${esc(t[0])}</td><td>${t[1]}%</td><td>${t[2]}</td></tr>`).join("")}</table>`:`<p class="muted">한 유형을 3문제 넘게 풀면 보여요.</p>`}</div>
   <div class="grid" style="margin-top:12px"><div class="card"><div class="muted">익힌 개념어</div><div class="big">${wq().known}</div></div><div class="card"><div class="muted">쓴 글</div><div class="big">${S.drafts.length}</div></div><div class="card"><div class="muted">논리학 통과</div><div class="big">${LOGIC.filter(u=>S.done[u.id]>=80).length}/${LOGIC.length}</div></div><div class="card"><div class="muted">심리학 통과</div><div class="big">${PSY.filter(u=>S.done[u.id]>=80).length}/${PSY.length}</div></div></div>`;
}

// ================= 화면 전환 =================
function route(){busy=false;clearInterval(curTick);const h=(location.hash||"#home").slice(1),[v,a,b]=h.split("/");
  document.querySelectorAll("#nav a").forEach(x=>x.classList.toggle("on",x.getAttribute("href")==="#"+(v==="gx"?"leet":v)));
  if(v==="logic")a?viewUnit(LOGIC,"logic",a,"논리학"):viewUnits(LOGIC,"logic","논리학","LEET 추리논증과 논리적 글쓰기의 뼈대. 단원마다 확인 문제 80점이 넘으면 통과예요.");
  else if(v==="psy")a?viewUnit(PSY,"psy",a,"심리학"):viewUnits(PSY,"psy","심리학 · 융을 중심으로","융의 분석심리학 아홉 단원과 다른 심리학 비교 한 단원. 단원마다 '글쓰기에 쓰는 법'이 붙어 있어요.");
  else if(v==="gx"&&a)viewGx(a);
  else if(v==="lib")a?viewRead(a):viewLib();
  else if(v==="novel")viewNovel(a,b);
  else if(v==="write")a&&KINDS[a]?editor(a,b):viewWrite();
  else ({home:viewHome,plan:viewPlan,words:viewWords,leet:viewLeet,review:viewReview,stats:viewStats}[v]||viewHome)();
  window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
document.getElementById("nav").addEventListener("click",e=>{const x=e.target.closest("a");if(x&&x.getAttribute("href")===location.hash){e.preventDefault();route()}});
$app.addEventListener("click",e=>{const x=e.target.closest("a[href^='#']");if(x&&x.getAttribute("href")===location.hash){e.preventDefault();route()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
initStore();
})();
</script>
</body>
</html>
