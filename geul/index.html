<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="생각과 글">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" type="image/png" href="icon.png">
<title>생각과 글 · LEET·논리·심리·글쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>

:root{
  /* 한 권의 학습 노트: 흰 종이, 검정 글씨, 진한 청록은 '눌러야 할 것'에만 */
  --paper:#fcfcfa; --card:#ffffff; --ink:#000000; --sub:#4a4f52; --line:#d8dcdc;
  --accent:#1d5a66; --accent-soft:#e3eff1; --good:#2d7a4b; --good-soft:#e5f3ea; --bad:#b0281c; --bad-soft:#fbe9e7; --warn:#8a5a00; --warn-soft:#fbf1dc;
  --font:"Gowun Batang","MaruBuri","Nanum Myeongjo","AppleMyungjo",serif;
  --en:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6}
button{font-family:inherit;font-size:1rem;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 6px;max-width:960px;margin:0 auto}
.top h1{font-size:1.25rem;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.8rem;color:var(--sub);white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 16px 8px;max-width:960px;margin:0 auto}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);padding:8px 14px;border-radius:10px;font-size:.95rem}
nav a.on{background:var(--accent);color:#fff}
main{max-width:960px;margin:0 auto;padding:20px}
h2{font-size:1.4rem;margin:.2rem 0 1rem;text-wrap:balance}
h3{font-size:1.1rem;margin:0 0 .5rem;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.big{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.muted{color:var(--sub);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.bad{background:var(--bad);border-color:var(--bad)} .btn.good{background:var(--good);border-color:var(--good)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:default}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;text-decoration:none;color:inherit}
.pill{font-size:.8rem;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.g{background:var(--good-soft);color:var(--good)} .pill.b{background:var(--bad-soft);color:var(--bad)} .pill.w{background:var(--warn-soft);color:var(--warn)}
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.flash .w{font-size:2.6rem;font-weight:700;font-family:var(--en)}
.q{font-size:1.15rem;font-family:var(--en);margin:12px 0 14px}
.passage{font-family:var(--en);white-space:pre-wrap;background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-height:46vh;overflow:auto;margin:12px 0;font-size:1rem;line-height:1.65}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;text-align:left;min-height:52px;cursor:pointer;font-family:var(--en)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.pic{border:1px solid var(--line);border-radius:12px;background:#fff;margin:14px 0;padding:6px}
.pic svg{display:block;width:100%;height:auto;max-height:340px}
.ex{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;white-space:pre-wrap}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent)}
ul.pts{padding-left:1.2rem;margin:.4rem 0 1rem} ul.pts li{margin:.3rem 0}
input,select{font-family:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
svg text{font-family:var(--font);fill:var(--sub);font-size:12px}
.en{font-family:var(--en)}
.sep{height:1px;background:var(--line);margin:18px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
table{border-collapse:collapse;width:100%} td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.stage{border-left:4px solid var(--line);padding-left:14px} .stage.now{border-left-color:var(--accent)} .stage.done{border-left-color:var(--good)}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.item{transition:background .15s,border-color .15s}}
.pr{color:var(--sub);font-size:.88em;letter-spacing:.01em}
.pr b{color:#000}
.ipa{font-family:"Times New Roman","Noto Serif","Charis SIL",serif;color:var(--sub)}
.prlist{margin:10px 0 0;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;background:#fff}
.prlist div{margin:4px 0}
.prdoc{background:#fff}
.prdoc h1{font-size:1.5em;margin:0 0 4px}
.prdoc h2{font-size:1.15em;margin:22px 0 6px;border-bottom:2px solid #000;padding-bottom:4px}
.prdoc table{width:100%;border-collapse:collapse;margin:8px 0}
.prdoc th,.prdoc td{border:1px solid #777;padding:5px 8px;text-align:left;font-size:.92em}
.prdoc ul{margin:6px 0;padding-left:20px}
.prdoc .wq{border:1px solid #777;border-radius:8px;padding:10px 12px;margin:10px 0;page-break-inside:avoid}
.prdoc .blank{color:#555;border-bottom:1px solid #999;display:inline-block;min-width:78%}
@media print{header,.noprint{display:none!important}body{background:#fff;color:#000;font-size:11.5pt}main{max-width:none;padding:0;margin:0}}

.flash .w{font-family:var(--font);font-size:2.2rem}
.hanja{color:var(--sub);font-size:1rem}
textarea{width:100%;min-height:42vh;font-family:var(--font);font-size:1.05rem;line-height:1.8;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#000;resize:vertical}
textarea.short{min-height:110px}
.passage{font-family:var(--font)} .q,.opt{font-family:var(--font)}
.tech{border-left:4px solid var(--line);padding:4px 0 4px 14px;margin:12px 0}
.tech b{display:block}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
details summary{cursor:pointer;font-weight:700}
.fb{white-space:pre-wrap}
.fb h4{margin:14px 0 4px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>생각과 글</h1><span class="chip" id="sync">저장 준비 중</span></div>
  <nav id="nav">
    <a href="#home">오늘</a><a href="#plan">플랜</a><a href="#words">개념어</a><a href="#logic">논리학</a><a href="#leet">LEET</a><a href="#psy">심리학</a><a href="#write">글쓰기</a><a href="#review">오답</a><a href="#stats">기록</a>
  </nav>
</header>
<main id="app"></main>
<script>
// ── 생각과 글: 기본 자료 ──────────────────────────────────────────
// 전부 이 앱을 위해 새로 쓴 설명·예문·문제. 실제 LEET 기출 지문은 저작권 때문에 넣지 않는다.

// 개념어·논리어 [단어, 한자·원어, 뜻, 예문, 헷갈리는 짝·쓰임]
const WORDS = [
 // 논리 연결 — 글의 뼈대를 만드는 말
 ["그러므로","—","앞의 내용이 근거가 되어 뒤의 결론이 나옴","모든 사람은 죽는다. 그러므로 소크라테스도 죽는다.","'그래서'보다 논리적 귀결이 강하다. 근거가 충분할 때만 쓴다.","논리 연결"],
 ["그럼에도","—","앞의 사실을 인정하면서도 반대되는 내용을 이어 감","근거는 약하다. 그럼에도 그 주장에는 귀 기울일 만한 데가 있다.","'그러나'는 단순 대립, '그럼에도'는 앞을 인정한 뒤의 대립(양보).","논리 연결"],
 ["요컨대","要―","앞의 내용을 간추려 핵심만 말하면","요컨대 문제는 제도가 아니라 사람이다.","결론·요약 신호. 언어이해에서 필자 견해가 나오는 자리.","논리 연결"],
 ["물론 ~ 그러나","—","예상되는 반론을 먼저 인정하고 내 주장으로 돌아옴","물론 효율도 중요하다. 그러나 효율만으로 정의를 말할 수는 없다.","반론 처리의 기본 틀. 논술 고득점 구조.","논리 연결"],
 ["가령","假令","예를 들어 가정하자면","가령 모든 거짓말이 금지된다면, 숨겨 준 사람의 행방을 묻는 살인자에게도 진실을 말해야 한다.","'예컨대'는 실제 예, '가령'은 가정한 예.","논리 연결"],
 ["즉","卽","앞말을 다른 말로 바꾸어 정확히 함","타당한 논증, 즉 전제가 참이면 결론이 반드시 참인 논증.","재진술(패러프레이즈) 신호 — 핵심 정의가 나오는 자리.","논리 연결"],
 ["오히려","—","예상과 반대로 / 앞보다 차라리","규제가 시장을 망친다고 했지만, 오히려 신뢰를 만들어 거래를 늘렸다.","통념 뒤집기 신호. 필자의 진짜 주장이 오는 자리.","논리 연결"],
 ["반면","反面","앞과 대조되는 다른 면에서는","귀납은 지식을 넓힌다. 반면 확실성은 잃는다.","두 대상의 대비. 비교·대조 문단의 핵심 접속어.","논리 연결"],
 // 추론·논증
 ["전제","前提","결론을 끌어내는 근거가 되는 명제","이 논증의 숨은 전제는 '경제성장은 곧 행복'이라는 생각이다.","결론 ↔ 전제. '숨은 전제' 찾기가 추리논증의 단골.","추론·논증"],
 ["결론","結論","전제들로부터 이끌어 낸 주장","결론이 전제에 이미 들어 있으면 순환논증이다.","주장(claim)과 같은 자리.","추론·논증"],
 ["논증","論證","전제를 들어 결론이 옳음을 보이는 글·말의 짜임","좋은 논증은 전제가 참이고 짜임이 타당하다.","'설명'은 왜 그런지를 밝힘, '논증'은 그렇다고 믿을 이유를 댐.","추론·논증"],
 ["타당성","妥當性","전제가 모두 참이면 결론이 반드시 참이 되는 논증의 형식적 성질","전제가 거짓이어도 논증은 타당할 수 있다.","타당성(형식) ≠ 건전성(타당 + 전제가 실제로 참).","추론·논증"],
 ["건전성","健全性","타당하면서 전제가 실제로 모두 참인 성질","건전한 논증의 결론은 반드시 참이다.","타당성과 짝으로 외운다.","추론·논증"],
 ["연역","演繹","일반 원리에서 개별 결론을 필연적으로 끌어냄","연역은 새 지식을 주지 않지만 확실하다.","↔ 귀납: 개별 사례에서 일반 결론을 개연적으로 끌어냄.","추론·논증"],
 ["귀납","歸納","여러 사례에서 일반 원리를 개연적으로 끌어냄","백 마리 백조가 희다고 모든 백조가 흰 것은 아니다 — 귀납의 한계.","결론이 '그럴듯함'에 그친다(개연성).","추론·논증"],
 ["유비 추론","類比推論","비슷한 점을 근거로 다른 점도 비슷하리라 추론함","쥐에게 효과가 있었으니 사람에게도 있으리라는 추론은 유비다.","약점: 비교 대상 사이의 '중요한 차이'.","추론·논증"],
 ["필요조건","必要條件","그것이 없으면 결과도 없는 조건(B 없으면 A 없음)","산소는 불이 타기 위한 필요조건이지만 충분조건은 아니다.","'A이면 B'에서 B는 A의 필요조건, A는 B의 충분조건.","추론·논증"],
 ["충분조건","充分條件","그것만 있으면 결과가 반드시 따르는 조건","비가 오는 것은 땅이 젖기 위한 충분조건이다.","필요조건과 반드시 짝으로.","추론·논증"],
 ["대우","對偶","'A이면 B'를 'B가 아니면 A가 아니다'로 바꾼 명제. 원명제와 참·거짓이 같다","'사람이면 죽는다'의 대우는 '죽지 않으면 사람이 아니다'.","역(B이면 A)·이(A가 아니면 B가 아니다)는 원명제와 참·거짓이 같지 않다.","추론·논증"],
 ["모순","矛盾","둘 중 하나는 반드시 참, 하나는 반드시 거짓인 관계","'모든 학생이 왔다'와 '어떤 학생은 오지 않았다'는 모순이다.","반대(contrary)는 둘 다 거짓일 수 있다 — '모두 왔다' vs '아무도 안 왔다'.","추론·논증"],
 ["반례","反例","일반 주장이 틀렸음을 보여 주는 하나의 사례","검은 백조 한 마리가 '모든 백조는 희다'의 반례다.","전칭 명제를 깨는 가장 강한 무기.","추론·논증"],
 ["함의","含意","겉으로 말하지 않았지만 논리적으로 따라 나오는 뜻","'그는 이번엔 지각하지 않았다'는 전에 지각했음을 함의한다.","'함축'과 비슷. 선택지 '~를 전제한다/함축한다' 판단의 핵심.","추론·논증"],
 ["개연성","蓋然性","그럴 가능성이 높은 정도(확실하지는 않음)","목격자 진술은 개연성을 높일 뿐 증명하지는 않는다.","필연성 ↔ 개연성.","추론·논증"],
 ["강화 · 약화","强化·弱化","새 정보가 주장(가설)을 더 그럴듯하게 / 덜 그럴듯하게 만듦","대조군에서도 같은 효과가 나타났다면 그 가설은 약화된다.","추리논증 '논증 평가' 유형의 기본 동사.","추론·논증"],
 ["상관관계 · 인과관계","相關·因果","함께 변함 / 하나가 다른 하나를 일으킴","아이스크림 판매와 익사 사고는 상관있지만 인과는 아니다 — 둘 다 더위 때문.","제3의 원인(교란 변수)을 먼저 의심한다.","추론·논증"],
 ["오류","誤謬","그럴듯하지만 잘못된 추론","상대의 주장을 비틀어 공격하는 것은 허수아비 오류다.","형식적 오류(구조) / 비형식적 오류(내용·말).","추론·논증"],
 // 인식·철학
 ["실존","實存","미리 정해진 본질보다 먼저, 지금 여기 존재하며 선택하는 인간의 있음","사르트르는 실존이 본질에 앞선다고 했다.","본질(그것을 그것이게 하는 성질)과 짝.","인식·철학"],

  use:"악역에게 주인공의 그림자를 맡기면 대립이 곧 내면의 싸움이 된다. 에세이에서는 '내가 미워한 것이 사실 나였다'는 깨달음의 구조.",
  q:[["그림자에 대한 융의 관점으로 알맞은 것은?",["완전히 없애야 할 악이다.","의식이 받아들이지 않은 자기 안의 면으로, 통합할 대상이다.","타인에게만 있다.","페르소나와 같은 것이다.","어린이에게만 나타난다."],1,"융은 그림자를 없애는 것이 아니라 인식하고 통합하는 것을 성장으로 보았다."]]},
 {id:"p6",title:"아니마와 아니무스 — 내 안의 다른 성",sum:"융은 남성 무의식의 여성적 면을 아니마, 여성 무의식의 남성적 면을 아니무스라 했다. 사랑에 빠질 때 상대에게 투사되기 쉽다. 오늘날에는 성별 고정관념을 넘어 '내 안의 반대 성향'으로 넓게 읽는다.",
  pts:["아니마: 감정·관계·영감의 면 / 아니무스: 판단·의지·논리의 면(융의 원래 구도)","첫눈에 반함 = 내 안의 상(像)을 상대에게 투사","통합되면 의식과 무의식을 잇는 다리 역할","융의 제자이자 동료 토니 볼프는 여성 유형을 네 가지로 나눠 이 논의를 넓혔다","비판: 융의 구분은 시대의 성 역할 관념에 묶여 있다"],
  use:"사랑을 쓰는 글에서 '그 사람'이 아니라 '그 사람에게 내가 비춘 무엇'을 쓰면 깊어진다.",
  q:[["아니마·아니무스 개념에 대한 설명으로 가장 알맞은 것은?",["실제 이성 친구를 가리킨다.","무의식에 있는 반대 성향의 이미지로, 이성에게 투사되기 쉽다.","의식의 중심이다.","사회적 가면이다.","현대 심리학에서 비판 없이 받아들여진다."],1,"투사와 통합이 핵심. 성 고정관념이라는 비판도 함께 알아 둔다."]]},
 {id:"p7",title:"자기와 개성화",sum:"자기(Self)는 의식과 무의식 전체의 중심이자 온전함의 원형이다. 개성화는 자아가 자기와 대화하며 온전해져 가는 평생의 과정이다.",
  pts:["자아(ego) ⊂ 자기(Self): 자아는 의식의 중심, 자기는 전체의 중심","개성화 ≠ 개인주의: 남과 달라지는 것이 아니라 온전한 나가 되는 것","단계(대략): 페르소나 벗기 → 그림자 만나기 → 아니마/아니무스 → 자기","만다라: 자기의 상징 — 원과 사각의 조화"],
  use:"성장 서사의 뼈대 — 인물이 잃는 것(페르소나)과 마주하는 것(그림자)을 순서대로 놓는다.",
  q:[["개성화에 대한 설명으로 옳은 것은?",["남들과 최대한 다르게 사는 것이다.","의식과 무의식을 통합해 온전한 자기가 되어 가는 과정이다.","어린 시절에 끝나는 과정이다.","페르소나를 더 강하게 만드는 것이다.","무의식을 없애는 것이다."],1,"개성화는 평생에 걸친 통합의 과정이다."]]},
 {id:"p8",title:"심리 유형 — 내향·외향과 네 기능",sum:"융은 에너지의 방향(내향·외향)과 네 기능(사고·감정·감각·직관)으로 사람의 유형을 나누었다. MBTI는 이를 바탕으로 나중에 만들어진 검사다.",
  pts:["내향: 에너지가 안으로 / 외향: 밖으로 — 수줍음과 다르다","판단 기능: 사고(논리) ↔ 감정(가치)","인식 기능: 감각(사실) ↔ 직관(가능성)","주기능의 반대편은 열등 기능 — 무의식에 가깝고 그림자와 얽힌다","MBTI는 융의 이론을 쓴 검사일 뿐, 융 자신이 만든 것은 아니다. 과학적 신뢰도 논쟁이 있다"],
  use:"인물마다 주기능을 하나 정하면 같은 사건에 대한 반응이 저절로 갈린다.",
  q:[["융의 심리 유형론에 대한 설명으로 옳은 것은?",["융이 MBTI 검사지를 직접 만들었다.","사고와 감정은 판단 기능, 감각과 직관은 인식 기능이다.","내향은 수줍음과 같은 말이다.","유형은 평생 한 번도 변하지 않는다고 단정했다.","기능은 두 가지뿐이다."],1,"MBTI는 브릭스와 마이어스가 만든 검사다."]]},
 {id:"p9",title:"동시성과 상징",sum:"동시성(synchronicity)은 인과로 묶이지 않은 마음속 사건과 바깥 사건이 의미 있게 겹치는 경험이다. 융은 상징을 '아직 다 알 수 없는 것의 가장 좋은 표현'이라 했다.",
  pts:["동시성: 의미 있는 우연 — 과학적 증명 대상이 아니라는 비판이 있다","기호(sign)는 뜻이 정해진 표시, 상징(symbol)은 뜻이 열려 있음","꿈 해석: 공식 사전이 아니라 꿈꾼 사람의 삶과 연결해 읽는다(확충법)"],
  use:"글에 상징을 쓸 때 뜻을 설명하지 않는다. 설명되는 순간 상징은 기호가 된다.",
  q:[["융이 말한 상징의 성격으로 알맞은 것은?",["뜻이 하나로 정해진 표시다.","아직 다 알 수 없는 것을 가장 잘 드러내는 열린 표현이다.","교통 표지판 같은 것이다.","설명할수록 힘이 세진다.","의식이 만든 약속이다."],1,"정해진 뜻의 표시는 기호다."]]},
 {id:"p10",title:"다른 심리학과 견주기",sum:"융만 알면 치우친다. 시험과 글쓰기에서 자주 맞붙는 이론을 함께 둔다.",
  pts:["프로이트: 이드·자아·초자아, 억압, 방어기제(투사·승화·합리화·부인)","아들러: 열등감과 우월성 추구, 사회적 관심, 출생 순서","에릭슨: 평생 8단계 발달 과제(청년기 = 정체성 대 역할 혼미)","인지행동: 사건이 아니라 해석(자동적 사고)이 감정을 만든다","인본주의(매슬로·로저스): 자기실현, 무조건적 존중"],
  use:"한 인물의 행동을 세 이론으로 각각 설명해 보면 해석의 폭이 넓어진다 — 논술 '관점 비교' 연습으로도 좋다.",
  q:[["'시험에 떨어진 것이 아니라 내가 쓸모없다는 생각이 나를 괴롭혔다.' 이를 가장 잘 설명하는 이론은?",["융의 원형론","인지행동 이론의 자동적 사고","에릭슨의 발달 단계","아들러의 출생 순서","프로이트의 이드"],1,"사건에 대한 해석(쓸모없다)이 감정을 만든다는 것이 인지행동의 핵심."]]},
];

 books:"실제 기출은 법학전문대학원협의회(leet.or.kr)에서 해마다 공개하고, 공식 해설서가 '법학적성시험 문제 해설'로 나온다. 이 앱의 지문·문제는 기출 형식을 본떠 새로 만든 연습용이라, 2단계부터는 공식 기출을 함께 푼다."
};

const STAGES_G = [
 {name:"1단계 · 생각의 도구",weeks:"4주",todo:["개념어 하루 15개","논리학 10단원 퀴즈 모두 통과","융 심리 10단원 읽기","논리적 글 주 2편(800자) + 첨삭"],skip:["LEET 실전 시간 재기 — 도구가 먼저","어려운 철학 원전 통독 — 개념어로 충분"]},
 {name:"2단계 · 읽는 힘",weeks:"6~8주",todo:["언어이해 지문 하루 1세트(문단 요약 쓰며)","추리논증 유형별 하루 3문제","문학적 글 주 1편 + 첨삭, 개념어 누적 300","공식 LEET 기출 1개년 시작"],skip:["모든 분야 배경지식 공부 — 지문만 믿는 연습이 우선","문제집 여러 권 동시 진행"]},
 {name:"3단계 · 실전",weeks:"시험까지",todo:["언어이해 30문항·추리논증 40문항 실전 주 1회","오답은 '근거 문장'과 '내가 끌린 이유' 두 줄","LEET 논술 주 1편(제시문 비교·적용)","공식 기출 최근 5개년 회독"],skip:["새 개념 공부 — 틀린 유형만","문학 글쓰기 비중 늘리기 — 시험 직전엔 논술 위주"]}
];

</script>
<script>
(function(){
"use strict";
const $app=document.getElementById("app");
const INT=[0,1,2,4,8,16,30,60], DAILY_NEW=15;
const N5=["①","②","③","④","⑤"];
function dayNum(d){d=d||new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)}
function dayStr(n){const d=new Date(n*86400000);return (d.getUTCMonth()+1)+"/"+d.getUTCDate()}
const TODAY=()=>dayNum();
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function $(id){return document.getElementById(id)}

// ================= 상태 =================
const BLANK=()=>({v:1,words:{},xw:[],wrong:{},done:{},logs:{},tags:{},drafts:[],stage:0,sets:[]});
let S=BLANK();
function fix(){const b=BLANK();for(const k in b)if(S[k]==null)S[k]=b[k]}
function log(){const k=TODAY();S.logs[k]=S.logs[k]||{w:0,q:0,c:0,m:0,ch:0};return S.logs[k]}
function streak(){let n=0,d=TODAY();if(!S.logs[d])d--;while(S.logs[d]&&(S.logs[d].w+S.logs[d].q+S.logs[d].ch)>0){n++;d--}return n}

// ================= 저장 =================
let ref=null,saving=false,dirty=false,timer=null,busy=false;
const LS="tb-geul-v1";
function setSync(t){$("sync").textContent=t}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
async function readRef(r){const s=await r.get();if(!s)return null;if(typeof s.data==="function"){return s.exists===false?null:s.data()}if(s.data!==undefined)return s.data;return s}
function save(){lsSet();dirty=true;clearTimeout(timer);timer=setTimeout(flush,1500)}
async function flush(){
  if(!ref||saving||!dirty)return;saving=true;dirty=false;setSync("저장 중…");
  try{await ref.set({json:JSON.stringify(S),updated:Date.now()});setSync("계정에 저장됨")}
  catch(e){setSync("저장 실패 · 이 기기에만 저장");dirty=true}
  saving=false;if(dirty)timer=setTimeout(flush,3000)}
function size(x){return x?Object.keys(x.logs||{}).length+Object.keys(x.words||{}).length+Object.keys(x.done||{}).length+(x.drafts||[]).length:0}
async function claudeUse(n){try{if(!window.claude||!window.claude.use)return null;return await Promise.race([window.claude.use(n),new Promise(r=>setTimeout(()=>r(null),10000))])}catch(e){return null}}
async function initStore(){
  const l=lsGet();if(l)S=Object.assign(BLANK(),l);fix();setSync("이 기기에만 저장");route();
  try{
    const db=await claudeUse("db"),user=await claudeUse("user");if(!db||!user)return;
    const id=await user.id();if(!id)return;
    ref=db.collection("data/users/"+id).doc("geul");
    const got=await readRef(ref);
    if(got&&got.json){const remote=JSON.parse(got.json);
      if(size(remote)>=size(lsGet())){S=Object.assign(BLANK(),remote);fix();lsSet()}else{dirty=true;flush()}}
    else{dirty=true;flush()}
    setSync("계정에 저장됨");if(!busy)route();
  }catch(e){setSync("이 기기에만 저장")}
}
let lastAct=Date.now();
["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{if(!document.hidden&&Date.now()-lastAct<180000){log().m++;save()}},60000);

// ================= Claude =================
let sampleFn=null,sampleState="wait";
(async()=>{sampleFn=await claudeUse("sample");sampleState=sampleFn?"ok":"none";if(!busy)route()})();
async function ask(prompt,tier){
  if(!sampleFn)throw {code:"none"};
  try{return await sampleFn.json(prompt,{modelTier:tier||"complex"})}
  catch(e){if(e&&(e.code==="not_granted"||e.code==="rate_limited"))throw e;
    const r=await sampleFn(prompt+"\nJSON 외의 글자는 절대 쓰지 마.",{modelTier:tier||"complex"});
    const t=(r&&r.text||"").replace(/^[^{]*/,"").replace(/[^}]*$/,"");return JSON.parse(t)}
}
async function askText(prompt,tier){
  if(!sampleFn)throw {code:"none"};
  const r=await sampleFn(prompt,{modelTier:tier||"complex"});return (r&&r.text)||String(r||"")}
function genError(e){
  if(e&&e.code==="none")return "이 화면에서는 Claude 기능을 쓸 수 없어요. claude.ai에서 앱을 열면 돼요. 기본 문제와 개념어는 그대로 쓸 수 있어요.";
  if(e&&e.code==="not_granted")return "Claude 사용 허락이 꺼져 있어요. 앱을 다시 열고 허락하면 돼요.";
  if(e&&e.code==="rate_limited")return "잠깐 너무 많이 요청했어요. 1~2분 뒤에 다시 눌러 주세요.";
  if(e&&e.code==="empty")return "만들어진 문제가 형식에 맞지 않아 버렸어요. 한 번만 다시 눌러 주세요.";
  return "만들지 못했어요. 잠시 뒤 다시 눌러 주세요.";
}
function cleanItems(raw,src,tag){
  const arr=(raw&&raw.questions)||[];const out=[];
  arr.forEach(q=>{if(!q||!q.q||!Array.isArray(q.o)||q.o.length!==5)return;const a=+q.a;if(!(a>=0&&a<5))return;
    out.push({id:uid(),src,tag:q.type||tag||src,q:String(q.q),o:q.o.map(String),a,ex:String(q.ex||"")})});
  return out}

// ================= 공용 문제 풀이 =================
function runQuiz(items,opt){
  opt=opt||{};busy=true;let i=0,right=0;
  function finish(){busy=false;
    if(opt.unit){S.done[opt.unit]=Math.max(S.done[opt.unit]||0,Math.round(right/items.length*100))}
    save();
    $app.innerHTML=`<h2>${esc(opt.title||"문제")} 끝</h2><div class="card"><div class="big">${right} / ${items.length}</div>
     <p class="muted">틀린 문제는 오답에 모였어요. 오답은 '근거 문장'과 '내가 끌린 이유'를 함께 보는 게 핵심이에요.</p>
     <div class="row"><button class="btn" id="done">확인</button></div></div>`;
    $("done").onclick=()=>{opt.onDone?opt.onDone(right,items.length):route()}}
  function draw(){
    if(i>=items.length)return finish();
    const it=items[i];
    $app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(opt.title||"문제")}</h2><span class="muted">${i+1} / ${items.length}</span></div>
     <div class="bar" style="margin-bottom:16px"><i style="width:${i/items.length*100}%"></i></div>
     <div class="card"><div class="row" style="justify-content:space-between"><span class="pill">${esc(it.src)}${it.tag&&it.tag!==it.src?" · "+esc(it.tag):""}</span>${it.gen?`<button class="btn ghost sm" id="flag">이상한 문제예요</button>`:""}</div>
     ${it.passage?`<div class="passage">${esc(it.passage)}</div>`:""}
     <p class="q">${esc(it.q)}</p>
     <div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${N5[k]} ${esc(o)}</button>`).join("")}</div>
     <div id="ex"></div></div>`;
    if($("flag"))$("flag").onclick=()=>{delete S.wrong[it.id];save();i++;draw()};
    $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if($app.querySelector(".opt.ok"))return;
      const k=+b.dataset.k,ok=k===it.a;
      $app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.k===it.a)o.classList.add("ok")});
      if(!ok)b.classList.add("no");
      const lg=log();lg.q++;if(ok)lg.c++;
      const tg=S.tags[it.tag]||{c:0,w:0};ok?tg.c++:tg.w++;S.tags[it.tag]=tg;
      if(ok){right++;if(opt.mode==="review")delete S.wrong[it.id]}
      else{const w=S.wrong[it.id]||{n:0};w.n++;w.t=TODAY();w.why=w.why||"";
        w.item={id:it.id,src:it.src,tag:it.tag,q:it.q,o:it.o,a:it.a,ex:it.ex,passage:it.passage?it.passage.slice(0,3000):undefined};
        S.wrong[it.id]=w;trimWrong()}
      save();
      $("ex").innerHTML=`<div class="ex"><strong>${ok?"맞았어요.":"틀렸어요. 정답은 "+N5[it.a]+"."}</strong>\n${esc(it.ex)}</div>
       ${ok?"":`<p class="muted" style="margin:12px 0 4px">내가 ${N5[k]}에 끌린 이유 한 줄 (오답노트에 함께 저장돼요)</p><textarea class="short" id="why" placeholder="예: '대부분'을 '모두'로 읽었다"></textarea>`}
       <div class="row" style="margin-top:14px"><button class="btn" id="next">${i+1<items.length?"다음":"결과 보기"}</button></div>`;
      $("next").onclick=()=>{const w=$("why");if(w&&w.value.trim()&&S.wrong[it.id]){S.wrong[it.id].why=w.value.trim();save()}i++;draw();window.scrollTo(0,0)};
    });
  }
  draw();
}
function trimWrong(){const ks=Object.keys(S.wrong);if(ks.length>300){ks.sort((a,b)=>S.wrong[a].t-S.wrong[b].t).slice(0,ks.length-300).forEach(k=>delete S.wrong[k])}}
function unitItems(u,src){return u.q.map((q,n)=>({id:u.id+"-"+n,src,tag:u.title,q:q[0],o:q[1],a:q[2],ex:q[3]}))}

// ================= 개념어 =================
function allWords(){return WORDS.concat(S.xw)}
function wq(){
  const t=TODAY(),ws=allWords(),due=[],fresh=[];
  ws.forEach((w,i)=>{const s=S.words[i];if(!s)fresh.push(i);else if(s.d<=t)due.push(i)});
  const newToday=Object.values(S.words).filter(s=>s.f===t).length;
  return {due,fresh:fresh.slice(0,Math.max(0,DAILY_NEW-newToday)),total:ws.length,known:Object.values(S.words).filter(s=>s.l>=3).length}}
function viewWords(){
  const q=wq(),cats={};allWords().forEach((w,i)=>{const c=w[5]||"내가 넣은 말";(cats[c]=cats[c]||[]).push(i)});
  $app.innerHTML=`<h2>개념어 · 논리 어휘</h2>
   <div class="grid"><div class="card"><div class="muted">오늘 복습</div><div class="big">${q.due.length}</div></div>
   <div class="card"><div class="muted">오늘 새 낱말</div><div class="big">${q.fresh.length}</div></div>
   <div class="card"><div class="muted">익힌 낱말</div><div class="big">${q.known} / ${q.total}</div></div></div>
   <div class="row" style="margin:16px 0"><button class="btn" id="go"${q.due.length+q.fresh.length?"":" disabled"}>카드 시작</button><button class="btn ghost" id="use">문장 만들기 연습</button></div>
   <p class="muted">뜻을 외우는 것보다 '헷갈리는 짝'과 함께 기억하는 게 LEET·논술에서 점수가 돼요. 카드 뒷면에서 꼭 확인하세요.</p>
   <div class="card"><h3>낱말 더하기</h3><p class="muted">책이나 지문에서 막힌 말을 넣으면 Claude가 뜻·예문·헷갈리는 짝을 채워요.</p>
   <div class="row"><input id="nw" placeholder="예: 정언명령" style="flex:1"><button class="btn" id="add">넣기</button></div><div id="am" class="muted"></div></div>
   <div class="sep"></div>${Object.entries(cats).map(([c,ix])=>`<details><summary>${esc(c)} <span class="muted">${ix.length}</span></summary>
   ${ix.map(i=>{const w=allWords()[i];return `<div class="tech"><b>${esc(w[0])} <span class="hanja">${w[1]!=="—"?esc(w[1]):""}</span></b>${esc(w[2])}<div class="muted">${esc(w[4])}</div></div>`}).join("")}</details>`).join("")}`;
  $("go").onclick=()=>wordSession(shuffle(q.due).concat(q.fresh));
  $("use").onclick=useWords;
  $("add").onclick=async()=>{const v=$("nw").value.trim();if(!v)return;$("am").textContent="뜻을 찾는 중…";
    try{const r=await ask(`한국어 개념어 학습 카드를 만들어. 낱말: "${v}". 대학 신입생이 논리적 글쓰기와 LEET 지문을 읽을 때 필요한 뜻으로.
JSON: {"w":"낱말","h":"한자나 원어, 없으면 —","m":"쉬운 뜻 한 문장","e":"이 낱말이 들어간 자연스러운 예문 하나","p":"헷갈리는 짝이나 쓰임 주의 한 문장"}`,"default");
      if(!r||!r.m)throw {code:"empty"};S.xw.push([r.w||v,r.h||"—",r.m,r.e||"",r.p||"","내가 넣은 말"]);save();viewWords()}
    catch(e){$("am").textContent=genError(e)}};
}
function wordSession(queue){
  busy=true;let i=0;const ws=allWords();
  function draw(){
    if(i>=queue.length){busy=false;$app.innerHTML=`<h2>오늘 카드 끝</h2><div class="card"><p>${queue.length}장을 넘겼어요. 내일 다시 나올 카드는 알아서 골라 둘게요.</p><div class="row"><button class="btn" id="b">확인</button><button class="btn ghost" id="u">문장 만들기로</button></div></div>`;$("b").onclick=()=>{location.hash="#home";route()};$("u").onclick=useWords;return}
    const idx=queue[i],w=ws[idx];
    $app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>개념어</h2><span class="muted">${i+1} / ${queue.length}</span></div>
     <div class="card flash"><span class="pill">${esc(w[5]||"")}</span><div class="w">${esc(w[0])}</div><div class="hanja">${w[1]!=="—"?esc(w[1]):""}</div>
     <p class="muted">뜻을 먼저 떠올려 말해 보고 뒤집으세요.</p><button class="btn" id="flip">뜻 보기</button><div id="back" hidden style="text-align:left;width:100%">
     <div class="ex"><b>${esc(w[2])}</b>\n\n예) ${esc(w[3])}\n\n짝·주의: ${esc(w[4])}</div>
     <div class="row" style="justify-content:center;margin-top:14px"><button class="btn bad" data-r="0">몰랐다</button><button class="btn ghost" data-r="1">애매했다</button><button class="btn good" data-r="2">알았다</button></div></div></div>`;
    $("flip").onclick=()=>{$("back").hidden=false;$("flip").hidden=true};
    $app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
      const r=+b.dataset.r,t=TODAY(),s=S.words[idx]||{l:0,f:t};
      s.l=r===0?0:r===1?Math.max(1,s.l):Math.min(INT.length-1,s.l+1);s.d=t+(r===0?0:INT[s.l]);S.words[idx]=s;
      log().w++;save();if(r===0)queue.push(idx);i++;draw()});
  }
  draw();
}
function useWords(){
  busy=true;const ws=allWords(),learned=Object.keys(S.words).map(Number).filter(i=>ws[i]);
  const pick=shuffle(learned.length>=3?learned:ws.map((_,i)=>i)).slice(0,3);
  $app.innerHTML=`<h2>문장 만들기</h2><div class="card"><p>아래 세 낱말을 <b>모두</b> 써서 두세 문장을 지어 보세요. 주제는 자유 — 오늘 있었던 일이어도 좋아요.</p>
   <div class="row">${pick.map(i=>`<span class="pill">${esc(ws[i][0])}</span>`).join("")}</div>
   <textarea class="short" id="t" style="margin-top:12px" placeholder="예: 그럼에도 …"></textarea>
   <div class="row" style="margin-top:10px"><button class="btn" id="c">Claude에게 봐 달라기</button><button class="btn ghost" id="o">다른 낱말</button></div><div id="fb"></div></div>`;
  $("o").onclick=useWords;
  $("c").onclick=async()=>{const t=$("t").value.trim();if(t.length<10)return;$("fb").innerHTML=`<p class="muted">읽는 중…</p>`;
    try{const r=await askText(`대학 신입생이 개념어 연습으로 쓴 문장이야. 낱말: ${pick.map(i=>ws[i][0]).join(", ")}.
문장: """${t}"""
낱말마다 ① 뜻에 맞게 썼는지(맞음/어긋남) ② 어긋났다면 왜, 고친 문장 하나. 마지막에 문장 흐름에 대한 한 줄. 짧게, 존댓말(해요체)로, 마크다운 기호 없이.`,"default");
      $("fb").innerHTML=`<div class="ex fb">${esc(r)}</div>`;log().ch++;save()}catch(e){$("fb").innerHTML=`<p class="muted">${esc(genError(e))}</p>`}};
}

// ================= 논리학 · 심리학 단원 =================
function viewUnits(list,key,title,intro){
  $app.innerHTML=`<h2>${title}</h2><p class="muted">${intro}</p><div class="list">${list.map((u,n)=>{const d=S.done[u.id];
   return `<a class="item" href="#${key}/${u.id}"><span>${n+1}. ${esc(u.title)}</span>${d==null?`<span class="pill w">아직</span>`:d>=80?`<span class="pill g">${d}점</span>`:`<span class="pill b">${d}점</span>`}</a>`}).join("")}</div>`}
function viewUnit(list,key,id,src){

function feedbackPrompt(kind,d){

  const head=`대학 신입생의 ${KINDS[kind][0]}을 첨삭해. 냉정하고 정확하게, 칭찬은 한 줄만. 해요체, 마크다운 기호(#, *, -) 없이 소제목은 【 】로.
과제: ${d.p}
${d.cl?"학생의 한 줄 주장: "+d.cl+"\n":""}글:
"""${d.t}"""
`;
  if(kind==="lit")return head+voice+`
【한 줄 평】
【장면과 행간】 감정을 직접 말한 문장을 찾아 사물·동작으로 바꾼 예를 하나씩.
【상투 표현】 닳은 비유·표현을 짚고 이 글에만 있을 법한 구체로 바꾼 예.
【반복과 어휘】 반복되는 낱말과 더 정확한 낱말.
【흐름】 문단 순서, 처음과 끝이 서로 답하는지, 여운이 남는지.
【고쳐 쓴 한 문단】 가장 약한 문단 하나를 학생의 문체를 지키며 고쳐 쓴 예.`;
  return head+(kind==="leet"?"LEET 논술 채점 기준(요구한 동사 이행, 제시문 재진술의 정확성, 적용의 정확성, 견해의 논증)으로 봐.\n":"")+voice+`
【한 줄 평】
【주장】 주장이 한 문장으로 분명한지, 과제가 묻는 것에 답했는지.
【근거와 논리】 근거의 종류(사실·원리·사례), 빠진 숨은 전제, 논리 오류(이름을 붙여서).
【반론 처리】 예상 반론을 공정하게 다루고 넘어섰는지, 없다면 넣을 반론 하나.
【문단 구성】 문단마다 소주제문, 접속어가 논리 관계와 맞는지.
【반복과 어휘】 반복되는 낱말과 더 정확한 개념어.
【고쳐 쓴 한 문단】 가장 약한 문단 하나를 학생의 문체를 지키며 고쳐 쓴 예.`;

async function makePdf(root){
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}
  const PW=1240,PH=1754,M=100,CW=PW-M*2;
  const FONT='"Gowun Batang","MaruBuri","Nanum Myeongjo","AppleMyungjo",serif';
  const pages=[]; let cx,y;
  function newPage(){const cv=document.createElement("canvas");cv.width=PW;cv.height=PH;cx=cv.getContext("2d");
    if(!cx)throw new Error("no canvas");cx.fillStyle="#fff";cx.fillRect(0,0,PW,PH);cx.fillStyle="#000";cx.strokeStyle="#000";cx.textBaseline="top";pages.push(cv);y=M;
    cx.font="20px "+FONT;cx.fillStyle="#666";cx.fillText(String(pages.length),PW-M,PH-M/2);cx.fillStyle="#000"}
  function font(sz,b){cx.font=(b?"700 ":"")+sz+"px "+FONT}
  function wrap(t,w){const out=[];String(t).split("\n").forEach(par=>{let line="";
    (par.match(/\S+\s*/g)||[""]).forEach(tok=>{
      if(cx.measureText(line+tok).width<=w){line+=tok;return}
      if(line.trim()){out.push(line.trimEnd());line=""}
      if(cx.measureText(tok).width<=w){line=tok;return}
      let cur="";for(const ch of tok){if(cx.measureText(cur+ch).width>w&&cur){out.push(cur);cur=ch}else cur+=ch}line=cur});
    out.push(line.trimEnd())});return out}
  function ensure(h){if(y+h>PH-M)newPage()}
  function text(t,sz,b,ind){ind=ind||0;font(sz,b);const lh=Math.round(sz*1.5);const ls=wrap(t,CW-ind);ls.forEach((l,n)=>{ensure(lh);cx.fillText(l,M+ind,y);y+=lh});return ls.length}
  function tx(el){const c=el.cloneNode(true);c.querySelectorAll("br").forEach(b=>b.replaceWith("\n"));c.querySelectorAll(".blank").forEach(b=>b.replaceWith("____________________________"));return c.textContent.replace(/\u00a0/g," ").replace(/[ \t]+/g," ").trim()}
  function table(tb){
    const rows=Array.from(tb.querySelectorAll("tr")).map(r=>Array.from(r.children).map(c=>({t:tx(c),h:c.tagName==="TH"})));
    if(!rows.length)return; const n=Math.max(...rows.map(r=>r.length)); font(24,false);
    const nat=Array.from({length:n},(_,c)=>Math.max(60,...rows.map(r=>r[c]?Math.min(CW*.55,cx.measureText(r[c].t).width+28):0)));
    const sum=nat.reduce((a,b)=>a+b,0), cw=nat.map(v=>v/sum*CW), lh=36;
    const head=rows[0]&&rows[0].every(c=>c.h)?rows[0]:null;
    function row(r){const ls=r.map((c,k)=>{font(24,c.h);return wrap(c.t,cw[k]-20)});const h=Math.max(...ls.map(l=>l.length))*lh+16;
      if(y+h>PH-M){newPage();if(head&&r!==head)row(head)}
      let x=M;r.forEach((c,k)=>{if(c.h){cx.fillStyle="#eee";cx.fillRect(x,y,cw[k],h);cx.fillStyle="#000"}cx.lineWidth=1.5;cx.strokeRect(x,y,cw[k],h);font(24,c.h);ls[k].forEach((l,j)=>cx.fillText(l,x+10,y+8+j*lh));x+=cw[k]});
      y+=h}
    rows.forEach(row); y+=14}
  function walk(el){
    Array.from(el.children).forEach(c=>{const t=c.tagName;
      if(t==="H1"){text(tx(c),44,true);y+=10}
      else if(t==="H2"){y+=18;ensure(80);text(tx(c),32,true);cx.fillRect(M,y,CW,3);y+=14}
      else if(t==="P"){text(tx(c),26,false);y+=8}
      else if(t==="UL"){Array.from(c.children).forEach(li=>{font(26,false);ensure(39);cx.fillText("•",M+6,y);text(tx(li),26,false,34);y+=4});y+=8}
      else if(t==="TABLE")table(c);
      else if(t==="DIV"){y+=10;ensure(60);cx.fillStyle="#888";cx.fillRect(M,y,CW,2);cx.fillStyle="#000";y+=14;walk(c);y+=c.classList.contains("wq")?90:6}
      else{const s=tx(c);if(s){text(s,26,false);y+=8}}})}
  newPage(); walk(root);
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length};
  const n=pages.length, pw=595.28, ph=841.89;
  push("%PDF-1.4\n");
  const obj=(id,body)=>{offs[id]=len;push(id+" 0 obj\n"+body+"\nendobj\n")};
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+pages.map((_,k)=>(3+3*k)+" 0 R").join(" ")+"] /Count "+n+" >>");
  pages.forEach((cv,k)=>{const p=3+3*k,im=p+1,ct=p+2;
    const u=cv.toDataURL("image/jpeg",.85), bs=atob(u.slice(u.indexOf(",")+1)), j=new Uint8Array(bs.length);for(let q=0;q<bs.length;q++)j[q]=bs.charCodeAt(q);
    obj(p,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw+" "+ph+"] /Resources << /XObject << /Im0 "+im+" 0 R >> >> /Contents "+ct+" 0 R >>");
    offs[im]=len;push(im+" 0 obj\n<< /Type /XObject /Subtype /Image /Width "+PW+" /Height "+PH+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+j.length+" >>\nstream\n");push(j);push("\nendstream\nendobj\n");
    const cs="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q";
    obj(ct,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream")});
  const total=3+3*n, xref=len; let x="xref\n0 "+total+"\n0000000000 65535 f \n";
  for(let q=1;q<total;q++)x+=String(offs[q]).padStart(10,"0")+" 00000 n \n";
  push(x);push("trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
  return new Blob(parts,{type:"application/pdf"});
}


function offerLink(blob,fn,m){try{const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=fn;a.textContent="PDF 열기: "+fn;a.className="btn ghost";a.style.marginLeft="8px";m.appendChild(a)}catch(e){}}
async function deliver(blob,fn,m){
  const dl=await claudeUse("downloads");
  if(dl&&dl.save){try{await dl.save({filename:fn,data:blob});return}catch(e){}}
  offerLink(blob,fn,m)}

// ================= 오답 =================
function viewReview(){
  const ws=Object.values(S.wrong).sort((a,b)=>b.t-a.t);
  $app.innerHTML=`<h2>오답 ${ws.length}</h2><p class="muted">LEET 오답은 '정답 근거 문장'과 '내가 끌린 이유'를 함께 봐야 같은 함정에 다시 안 빠져요.</p>
   <div class="row" style="margin:12px 0"><button class="btn" id="go"${ws.length?"":" disabled"}>오답 다시 풀기 (최대 10)</button><button class="btn ghost" id="pdf"${ws.length?"":" disabled"}>오답노트 PDF</button></div>
   <div class="list">${ws.slice(0,40).map(w=>`<details><summary>${esc(w.item.src)} · ${esc(w.item.tag||"")} <span class="muted">${w.n}번 틀림</span></summary><p>${esc(w.item.q.slice(0,300))}</p><div class="ex">정답 ${N5[w.item.a]} ${esc(w.item.o[w.item.a])}\n${esc(w.item.ex)}${w.why?"\n\n내가 끌린 이유: "+esc(w.why):""}</div></details>`).join("")}</div>`;
  $("go").onclick=()=>runQuiz(shuffle(ws).slice(0,10).map(w=>Object.assign({},w.item)),{title:"오답 다시",mode:"review"});
  $("pdf").onclick=async()=>{const box=document.createElement("div");box.innerHTML=`<h1>오답노트</h1>${ws.slice(0,40).map((w,n)=>`<h2>${n+1}. ${esc(w.item.src)} · ${esc(w.item.tag||"")}</h2><p>${esc(w.item.q)}</p><ul>${w.item.o.map((o,k)=>`<li>${N5[k]} ${esc(o)}</li>`).join("")}</ul><p>정답 ${N5[w.item.a]} — ${esc(w.item.ex)}</p>${w.why?`<p>내가 끌린 이유: ${esc(w.why)}</p>`:""}`).join("")}`;
    $("pdf").textContent="만드는 중…";try{await deliver(await makePdf(box),"오답노트.pdf",$("pdf").parentNode)}catch(e){}$("pdf").textContent="오답노트 PDF"};
}

// ================= 플랜 =================
function viewPlan(){
  $app.innerHTML=`<h2>플랜</h2><p class="muted">지금 단계를 눌러 두면 '오늘' 화면이 그 단계에 맞춰져요.</p>
   ${STAGES_G.map((s,n)=>`<div class="card stage${n===S.stage?" now":n<S.stage?" done":""}" style="margin:12px 0"><div class="row" style="justify-content:space-between"><h3>${esc(s.name)} <span class="muted">${esc(s.weeks)}</span></h3>${n===S.stage?`<span class="pill">지금</span>`:`<button class="btn ghost sm" data-s="${n}">이 단계로</button>`}</div>
   <b>할 것</b><ul class="pts">${s.todo.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><b>지금은 안 해도 되는 것</b><ul class="pts">${s.skip.map(x=>`<li class="muted">${esc(x)}</li>`).join("")}</ul></div>`).join("")}
   <div class="card"><h3>공부 원리 세 가지</h3><ul class="pts"><li>읽기보다 꺼내기 — 개념어 카드와 확인 문제가 다시 읽기보다 오래 남아요.</li><li>나눠서 자주 — 하루 몰아서보다 매일 30분이 나아요(간격 반복).</li><li>섞어서 — 추리논증은 유형을 섞어 풀어야 실전에서 유형을 알아봐요.</li></ul></div>`;
  $app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.stage=+b.dataset.s;save();viewPlan()});
}

// ================= 오늘 =================
function nextUnit(list){return list.find(u=>!(S.done[u.id]>=80))}
function viewHome(){
  const q=wq(),lg=S.logs[TODAY()]||{w:0,q:0,c:0,m:0,ch:0},st=STAGES_G[S.stage];
  const lu=nextUnit(LOGIC),pu=nextUnit(PSY),wk=Object.values(S.drafts).filter(d=>d.d>TODAY()-7).length;
  const tasks=[];
  tasks.push([`개념어 카드 ${q.due.length+q.fresh.length}장`,"#words",q.due.length+q.fresh.length===0]);
  if(S.stage===0){if(lu)tasks.push([`논리학 · ${lu.title}`,"#logic/"+lu.id,false]);if(pu)tasks.push([`심리학 · ${pu.title}`,"#psy/"+pu.id,false])}
  if(S.stage>=1)tasks.push(["언어이해 지문 1세트(문단 요약 쓰며)","#leet",false],["추리논증 유형 3문제","#leet",false]);
  if(S.stage===2)tasks.push(["LEET 논술 한 편","#write/leet",false]);
  tasks.push([wk>=2?"이번 주 글 "+wk+"편 썼어요":"이번 주 글 "+wk+"편 — 한 편 더",wk%2?"#write/lit":"#write/logic",wk>=2]);
  $app.innerHTML=`<h2>오늘</h2><p class="muted">${esc(st.name)} · ${streak()}일째 이어서 공부 중</p>
   <div class="grid"><div class="card"><div class="muted">오늘 카드</div><div class="big">${lg.w}</div></div><div class="card"><div class="muted">오늘 문제</div><div class="big">${lg.c}/${lg.q}</div></div><div class="card"><div class="muted">오늘 공부 시간</div><div class="big">${lg.m}분</div></div></div>
   <h3 style="margin-top:20px">오늘 할 것</h3><div class="list">${tasks.map(t=>`<a class="item" href="${t[1]}"><span>${esc(t[0])}</span>${t[2]?`<span class="pill g">됨</span>`:`<span class="pill">하기</span>`}</a>`).join("")}</div>
   ${sampleState==="none"?`<p class="muted" style="margin-top:14px">지금은 Claude 기능(문제 생성·첨삭)을 쓸 수 없는 화면이에요. claude.ai에서 열면 돼요.</p>`:""}`;
}

// ================= 기록 =================
function viewStats(){
  const days=[];for(let k=13;k>=0;k--){const d=TODAY()-k;days.push([dayStr(d),S.logs[d]||{w:0,q:0,c:0,m:0,ch:0}])}
  const mx=Math.max(1,...days.map(d=>d[1].m));
  const tags=Object.entries(S.tags).filter(([t,v])=>v.c+v.w>=3).map(([t,v])=>[t,Math.round(v.c/(v.c+v.w)*100),v.c+v.w]).sort((a,b)=>a[1]-b[1]);
  $app.innerHTML=`<h2>기록</h2><div class="card"><h3>최근 2주 공부 시간</h3>
   <svg viewBox="0 0 700 180" role="img" aria-label="최근 2주 공부 시간">${days.map((d,k)=>{const h=Math.round(d[1].m/mx*120);return `<rect x="${k*50+8}" y="${140-h}" width="34" height="${h}" fill="#1d5a66"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" type="image/png" href="icon.png">
<title>${d[0]} ${d[1].m}분</title></rect><text x="${k*50+25}" y="160" text-anchor="middle">${d[0]}</text>${d[1].m?`<text x="${k*50+25}" y="${134-h}" text-anchor="middle">${d[1].m}</text>`:""}`}).join("")}</svg></div>
   <div class="card" style="margin-top:12px"><h3>유형별 정답률 (낮은 순)</h3>${tags.length?`<table><tr><th>유형</th><th>정답률</th><th>푼 수</th></tr>${tags.map(t=>`<tr><td>${esc(t[0])}</td><td>${t[1]}%</td><td>${t[2]}</td></tr>`).join("")}</table>`:`<p class="muted">한 유형을 3문제 넘게 풀면 보여요.</p>`}</div>
   <div class="grid" style="margin-top:12px"><div class="card"><div class="muted">익힌 개념어</div><div class="big">${wq().known}</div></div><div class="card"><div class="muted">쓴 글</div><div class="big">${S.drafts.length}</div></div><div class="card"><div class="muted">논리학 통과</div><div class="big">${LOGIC.filter(u=>S.done[u.id]>=80).length}/${LOGIC.length}</div></div><div class="card"><div class="muted">심리학 통과</div><div class="big">${PSY.filter(u=>S.done[u.id]>=80).length}/${PSY.length}</div></div></div>`;
}

// ================= 화면 전환 =================
function route(){busy=false;const h=(location.hash||"#home").slice(1),[v,a,b]=h.split("/");
  document.querySelectorAll("#nav a").forEach(x=>x.classList.toggle("on",x.getAttribute("href")==="#"+v));
  if(v==="logic")a?viewUnit(LOGIC,"logic",a,"논리학"):viewUnits(LOGIC,"logic","논리학","LEET 추리논증과 논리적 글쓰기의 뼈대. 단원마다 확인 문제 80점이 넘으면 통과예요.");
  else if(v==="psy")a?viewUnit(PSY,"psy",a,"심리학"):viewUnits(PSY,"psy","심리학 · 융을 중심으로","융의 분석심리학 아홉 단원과 다른 심리학 비교 한 단원. 단원마다 '글쓰기에 쓰는 법'이 붙어 있어요.");
  else if(v==="write")a&&KINDS[a]?editor(a,b):viewWrite();
  else ({home:viewHome,plan:viewPlan,words:viewWords,leet:viewLeet,review:viewReview,stats:viewStats}[v]||viewHome)();
  window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
document.getElementById("nav").addEventListener("click",e=>{const x=e.target.closest("a");if(x&&x.getAttribute("href")===location.hash){e.preventDefault();route()}});
$app.addEventListener("click",e=>{const x=e.target.closest("a[href^='#']");if(x&&x.getAttribute("href")===location.hash){e.preventDefault();route()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
initStore();
})();
