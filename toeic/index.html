<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태빈 토익 독학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{

  --paper:#fcfcfa; --card:#ffffff; --ink:#000000; --sub:#4a4f52; --line:#d8dcdc;

  --en:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6}
button{font-family:inherit;font-size:1rem;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 6px;max-width:960px;margin:0 auto}
.top h1{font-size:1.25rem;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.8rem;color:var(--sub);white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 16px 8px;max-width:960px;margin:0 auto}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);padding:8px 14px;border-radius:10px;font-size:.95rem}
nav a.on{background:var(--accent);color:#fff}
main{max-width:960px;margin:0 auto;padding:20px}
h2{font-size:1.4rem;margin:.2rem 0 1rem;text-wrap:balance}
h3{font-size:1.1rem;margin:0 0 .5rem;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.big{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.muted{color:var(--sub);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.bad{background:var(--bad);border-color:var(--bad)} .btn.good{background:var(--good);border-color:var(--good)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:default}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;text-decoration:none;color:inherit}
.pill{font-size:.8rem;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.g{background:var(--good-soft);color:var(--good)} .pill.b{background:var(--bad-soft);color:var(--bad)} .pill.w{background:var(--warn-soft);color:var(--warn)}
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.flash .w{font-size:2.6rem;font-weight:700;font-family:var(--en)}
.q{font-size:1.15rem;font-family:var(--en);margin:12px 0 14px}
.passage{font-family:var(--en);white-space:pre-wrap;background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-height:46vh;overflow:auto;margin:12px 0;font-size:1rem;line-height:1.65}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;text-align:left;min-height:52px;cursor:pointer;font-family:var(--en)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.ex{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;white-space:pre-wrap}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent)}
ul.pts{padding-left:1.2rem;margin:.4rem 0 1rem} ul.pts li{margin:.3rem 0}
input,select{font-family:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
svg text{font-family:var(--font);fill:var(--sub);font-size:12px}
.en{font-family:var(--en)}
.sep{height:1px;background:var(--line);margin:18px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
table{border-collapse:collapse;width:100%} td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.stage{border-left:4px solid var(--line);padding-left:14px} .stage.now{border-left-color:var(--accent)} .stage.done{border-left-color:var(--good)}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.item{transition:background .15s,border-color .15s}}
</style>
</head>

let tts=null, voices=[];
(async()=>{try{if(window.claude&&window.claude.use)tts=await window.claude.use("tts")}catch(e){}})();
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang))}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function canSpeak(){return !!tts||("speechSynthesis" in window)}
function pickVoice(sp){if(!voices.length)return null;
  const us=voices.filter(v=>/en-US/i.test(v.lang)), pool=us.length>1?us:voices;
  const fem=pool.find(v=>/female|samantha|zira|aria|jenny|allison|ava|susan/i.test(v.name)), mal=pool.find(v=>/male|daniel|alex|fred|guy|david|tom/i.test(v.name)&&!/female/i.test(v.name));
  if(sp==="W")return fem||pool[0]; if(sp==="M")return mal||pool[Math.min(1,pool.length-1)]; return pool[0]}
function stopSpeak(){try{tts&&tts.stop()}catch(e){} try{speechSynthesis.cancel()}catch(e){}}
// lines: 문자열 또는 {sp:"M"|"W"|"N", t:"..."}
async function speak(lines){
  if(!Array.isArray(lines))lines=[lines];
  lines=lines.map(x=>typeof x==="string"?{sp:"N",t:x}:x);
  if(tts){try{await tts.speak(lines.map(x=>({text:x.t,language:"en",voice:x.sp==="W"?"airy":x.sp==="M"?"rounded":"buttery"})));return}catch(e){}}
  if("speechSynthesis" in window){speechSynthesis.cancel();
    lines.forEach(x=>{const u=new SpeechSynthesisUtterance(x.t);u.lang="en-US";u.rate=S.rate||.95;const v=pickVoice(x.sp);if(v)u.voice=v;speechSynthesis.speak(u)})}
}

function promptFor(part,level,focus){
  const P=PARTS[part], Lv=LEVELS[level];
  return `너는 한국인 수험생을 위한 TOEIC 문제 출제자다. 실제 ETS 기출 문항을 그대로 베끼지 말고, 형식과 난이도만 실제 시험과 똑같은 새 문제를 만든다.

${focus&&focus.length?"특히 이 약점을 집중 출제: "+focus.join(", "):""}
만들 것: ${P.spec}

모든 문제 공통 규칙:

- "tag"는 짧은 한국어 유형명(예: 품사, 시제, 수일치, 능동/수동, 관계사, 접속사/전치사, 어휘, 대명사, 비교, 의문사 응답, 간접 응답, 세부 사항, 추론, 주제, 동의어, 문장 삽입, 화자 의도).
- 영어는 자연스러운 미국식 비즈니스 영어. 사람 이름·회사 이름은 가상으로.
- 출력은 JSON 하나만. 설명 문장, 코드 블록 표시 금지.
형식: {"sets":[{"scene":"(파트1만)","passage":"(파트6·7만)","audio":[{"sp":"M","t":"..."}](파트3·4만),"items":[{"q":"...","o":["..."],"a":0,"ex":"...","tag":"..."}]}]}`;
}
function cleanSets(raw,part){
  const P=PARTS[part], out=[];
  const sets=(raw&&raw.sets)||[];
  sets.forEach(s=>{
    const items=(s.items||[]).filter(it=>it&&Array.isArray(it.o)&&it.o.length===P.opts&&Number.isInteger(+it.a)&&+it.a>=0&&+it.a<P.opts&&it.ex).map(it=>{
      const o={id:uid(),src:P.name,part,tag:String(it.tag||P.name).slice(0,20),q:String(it.q||""),o:it.o.map(String),a:+it.a,ex:String(it.ex)};
      if(part==="p1")o.say=it.o.map((x,k)=>L[k]+". "+x);
      if(part==="p2")o.say=[o.q].concat(it.o.map((x,k)=>L[k]+". "+x));
      return o});
    if(!items.length)return;
    const set={items};
    if(s.scene)set.scene=String(s.scene);
    if(s.passage)set.passage=String(s.passage);
    if(Array.isArray(s.audio)&&s.audio.length)set.audio=s.audio.filter(a=>a&&a.t).map(a=>({sp:a.sp==="W"?"W":a.sp==="M"?"M":"N",t:String(a.t)}));
    if((part==="p3"||part==="p4")&&!set.audio)return;
    if((part==="p6"||part==="p7")&&!set.passage)return;
    out.push(set)});
  return out;
}
async function generate(part,level,focus,onStatus){
  if(!sampleFn)throw {code:"none"};
  onStatus&&onStatus("Claude가 문제를 만드는 중이에요…");
  let raw;
  try{raw=await sampleFn.json(promptFor(part,level,focus),{modelTier:part==="p7"||part==="p6"||level>=2?"complex":"default"})}
  catch(e){ // json 실패 시 text로 한 번 더
    if(e&&(e.code==="not_granted"||e.code==="rate_limited"))throw e;
    const r=await sampleFn(promptFor(part,level,focus)+"\nJSON 외의 글자는 절대 쓰지 마.",{modelTier:"default"});
    const t=(r&&r.text||"").replace(/^[^{]*/,"").replace(/[^}]*$/,""); raw=JSON.parse(t)}
  const sets=cleanSets(raw,part);
  if(!sets.length)throw {code:"empty"};
  return sets;
}
function genError(e){

function runSets(sets,opt){
  opt=opt||{}; busy=true;
  const steps=[]; sets.forEach((s,si)=>s.items.forEach((it,ii)=>steps.push({s,it,first:ii===0})));
  let i=0,right=0,answered=0,limit=opt.seconds?Date.now()+opt.seconds*1000:0,tick=null;
  const res={};
  function finish(){
    clearInterval(tick); busy=false; stopSpeak();

    $app.innerHTML=`<h2>${esc(opt.title||"문제")} 끝</h2><div class="card"><div class="big">${right} / ${total}</div>
     <p class="muted">${answered<total?`시간이 끝나 ${total-answered}문제는 풀지 못했어요. `:""}틀린 문제는 오답노트에 모였어요.</p>
     <div class="list">${Object.entries(res).map(([p,v])=>`<div class="row" style="justify-content:space-between"><span>${esc(PARTS[p]?PARTS[p].name:p)}</span><b>${v.r}/${v.n}</b></div>`).join("")}</div>
     <div class="row" style="margin-top:12px"><button class="btn" id="done">확인</button></div></div>`;
    document.getElementById("done").onclick=()=>{opt.onDone?opt.onDone(right,total):route()};
  }
  function timeStr(){if(!limit)return"";const s=Math.max(0,Math.round((limit-Date.now())/1000));return `<span class="timer${s<120?" low":""}" id="tm">${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}</span>`}
  if(limit)curTick=tick=setInterval(()=>{const el=document.getElementById("tm");const s=Math.max(0,Math.round((limit-Date.now())/1000));if(el){el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");el.classList.toggle("low",s<120)}if(s<=0)finish()},1000);
  function draw(){
    if(i>=steps.length)return finish();
    const {s,it}=steps[i], P=PARTS[it.part]||{}, isLC=!!P.lc;
    const hideText=isLC&&(it.part==="p1"||it.part==="p2");
    const showAudio=s.audio||it.say;
    $app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(opt.title||"문제")}</h2><span class="row"><span class="muted">${i+1} / ${steps.length}</span>${timeStr()}</span></div>
      <div class="bar" style="margin-bottom:16px"><i style="width:${i/steps.length*100}%"></i></div>
      <div class="card"><div class="row" style="justify-content:space-between"><span class="pill">${esc(it.src)}${it.tag&&it.tag!==it.src?" · "+esc(it.tag):""}</span><button class="btn ghost sm" id="flag" title="이상한 문제 버리기">이상한 문제예요</button></div>
      ${s.scene?`<div class="ex" style="border-left-color:var(--warn);background:var(--warn-soft)"><b>장면</b> ${esc(s.scene)}</div>`:""}
      ${showAudio?`<div class="row" style="margin:14px 0"><button class="btn" id="play">▶ 듣기</button><button class="btn ghost" id="slow">▶ 천천히</button><button class="btn ghost" id="script">스크립트 보기</button></div><div id="scr" hidden class="passage"></div>`:""}
      ${s.passage?`<div class="passage">${esc(s.passage)}</div>`:""}
      ${hideText?"":`<p class="q">${esc(it.q).replace(/_{3,}/,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}</p>`}
      <div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${L[k]}. <span class="ot"${hideText?" hidden":""}>${esc(o)}</span></button>`).join("")}</div>
      <div id="ex"></div></div>`;
    const lines=s.audio||it.say;
    function scriptText(){return (s.audio?s.audio.map(a=>(a.sp==="N"?"":a.sp+": ")+a.t).join("\n"):it.say.join("\n"))}
    if(showAudio){
      const pb=document.getElementById("play"), sb=document.getElementById("slow");

      const lg=log(); lg.q++; if(ok)lg.c++; S.solved[it.id]=1;
      const tg=S.tags[it.tag]||{c:0,w:0}; ok?tg.c++:tg.w++; S.tags[it.tag]=tg;
      const pp=S.parts[it.part]||{c:0,w:0}; ok?pp.c++:pp.w++; S.parts[it.part]=pp;
      res[it.part]=res[it.part]||{r:0,n:0}; res[it.part].n++;
      if(ok){right++;res[it.part].r++; if(opt.mode==="review")delete S.wrong[it.id]}
      else{const w=S.wrong[it.id]||{n:0}; w.n++; w.t=TODAY();
        w.item={id:it.id,src:it.src,part:it.part,tag:it.tag,q:it.q,o:it.o,a:it.a,ex:it.ex,say:it.say};
        w.ctx={scene:s.scene,passage:s.passage?s.passage.slice(0,2500):undefined,audio:s.audio};
        S.wrong[it.id]=w; trimWrong()}
      save();
      if(opt.mock&&!opt.explain){i++;draw();return}
      document.getElementById("ex").innerHTML=`<div class="ex"><strong>${ok?"맞았어요.":"틀렸어요. 정답은 "+L[it.a]+"."}</strong>\n${esc(it.ex)}</div><div class="row" style="margin-top:14px"><button class="btn" id="next">${i+1<steps.length?"다음":"결과 보기"}</button></div>`;
      if(showAudio){const t=document.getElementById("scr");t.hidden=false;t.textContent=scriptText()}
      document.getElementById("next").onclick=()=>{i++;draw();window.scrollTo(0,0)};
    });
  }
  draw();
}

function wordSession(queue){
  let q=queue.slice(), again=new Set(), done=0; busy=true; const W=allWords();
  function draw(){
    if(!q.length){busy=false;$app.innerHTML=`<h2>오늘 단어 끝</h2><div class="card"><div class="big">${done}장</div><p class="muted">몰랐던 단어는 내일 다시 나와요.</p><a class="btn" href="#home">오늘 화면으로</a></div>`;return}
    const i=q[0], w=W[i];
    $app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>단어</h2><span class="muted">남은 카드 ${q.length}</span></div>
      <div class="card flash"><div class="w">${esc(w[0])}</div><div class="muted">${esc(w[1])}사</div>
      <div class="row"><button class="btn ghost" id="say">▶ 발음</button><button class="btn" id="show">뜻 보기</button></div><div id="back"></div></div>
      <div class="row" style="margin-top:14px;justify-content:center"><button class="btn bad" id="no" disabled>몰랐어요</button><button class="btn good" id="yes" disabled>알았어요</button></div>`;
    document.getElementById("say").onclick=()=>speak(w[0]);
    document.getElementById("show").onclick=()=>{document.getElementById("back").innerHTML=`<div style="font-size:1.4rem;font-weight:700">${esc(w[2])}</div><p class="en" style="margin:.6rem 0 0">${esc(w[3])}</p><p class="muted" style="margin:.2rem 0">${esc(w[4])}</p><button class="btn ghost" id="sayEx">▶ 예문 듣기</button>`;
      document.getElementById("sayEx").onclick=()=>speak(w[3]);document.getElementById("no").disabled=false;document.getElementById("yes").disabled=false;document.getElementById("show").remove()};
    function answer(ok){
      const t=TODAY(), key=wkey(i); let s=S.words[key]||{b:0,d:t,f:t};
      if(ok&&!again.has(i)){s.b=Math.min(s.b+1,6);s.d=t+INT[s.b]}
      else if(ok){s.d=t+1}
      else{s.b=1;s.d=t+1;if(!again.has(i)){again.add(i);q.push(i)}}
      S.words[key]=s; log().w++; done++; save(); q.shift(); draw();
    }
    document.getElementById("no").onclick=()=>answer(false);
    document.getElementById("yes").onclick=()=>answer(true);
  }
  draw();
}

    const W=allWords(), vw=shuffle(W.map((_,i)=>i)).slice(0,6);
    const vitems=vw.map(i=>{const o=shuffle([W[i][2]].concat(shuffle(W.map((w,j)=>j).filter(j=>j!==i)).slice(0,3).map(j=>W[j][2])));return {id:"v:"+i,src:"단어 뜻",part:"vocab",tag:"어휘",q:W[i][0]+" 의 뜻은?",o,a:o.indexOf(W[i][2]),ex:W[i][0]+" = "+W[i][2]+"\n예문: "+W[i][3]+" ("+W[i][4]+")"}});
    const g=shuffle(Object.keys(QB).filter(k=>k.startsWith("g:"))).slice(0,7), p=shuffle(Object.keys(QB).filter(k=>k.startsWith("p:"))).slice(0,7);
    const items=shuffle(vitems.concat(g.concat(p).map(id=>Object.assign({id},QB[id]))));
    runSets([{items}],{title:"진단 테스트",onDone:(r,n)=>{const pct=Math.round(r/n*100),b=band(pct);S.diag.push({d:TODAY(),p:pct,b:b[0]});S.level=pct<50?0:pct<70?1:pct<85?2:3;save();
      $app.innerHTML=`<h2>진단 결과</h2><div class="card"><div class="big">${pct}%</div><h3>${esc(b[0])}</h3><p>${esc(b[1])}</p><p>난이도를 <b>${LEVELS[S.level].name}</b>으로 맞춰 두었어요.</p><a class="btn" href="#roadmap">로드맵 보기</a></div>`}});
  };
}

// ================= 로드맵 =================
const STAGES=[
 {name:"1단계 · 뼈대 (~450)",goal:450,todo:["단어 하루 30개 (기초)","문법 10단원 퀴즈 모두 3/4 이상","파트5 기본 45문제, 파트2 기본 15문제 끝내기"]},
 {name:"2단계 · 유형 익히기 (450~700)",goal:700,todo:["단어 중급으로 올려 누적 1,000개","파트별 새 문제를 중급으로 매일 2파트","파트5 정답률 75%, 파트2 70% 넘기기"]},
 {name:"3단계 · 실전 (700~900)",goal:900,todo:["단어 고급, 누적 2,000개","하프 모의고사 주 2회 (고급)","약점 유형 집중을 켜고 파트3·4·7 매일"]},
 {name:"4단계 · 만점 (900~990)",goal:990,todo:["단어 만점 수준, 누적 3,000개 이상","만점 난이도 모의고사 주 3회, 시간 안에 다 풀기","모든 파트 정답률 95% 이상, 오답노트 0개 유지"]}
];
function curScore(){const s=S.scores.slice().sort((a,b)=>a.d-b.d);return s.length?s[s.length-1].s:null}
function viewRoadmap(){
  const sc=curScore(), now=sc==null?(S.diag.length?Math.min(3,S.level):0):STAGES.findIndex(x=>sc<x.goal);
  const idx=now<0?3:now;
  $app.innerHTML=`<h2>990점 로드맵</h2>
   <div class="grid"><div class="card"><div class="muted">원서 접수까지</div><div class="big">D-${dday()}</div></div><div class="card"><div class="muted">최근 토익</div><div class="big">${sc??"–"}</div><div class="muted">목표 990</div></div><div class="card"><div class="muted">지금 단계</div><div class="big">${idx+1}단계</div></div></div>
   <div class="list" style="margin-top:14px">${STAGES.map((st,k)=>`<div class="card stage ${k<idx?"done":k===idx?"now":""}"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(st.name)}</h3>${k<idx?'<span class="pill g">통과</span>':k===idx?'<span class="pill">지금</span>':""}</div><ul class="pts">${st.todo.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`).join("")}</div>
   <div class="card" style="margin-top:12px"><h3>솔직한 안내</h3><p>이 앱의 문제는 실제 토익 형식과 난이도를 본떠 Claude가 새로 만든 문제예요. 만점은 실제 시험장의 녹음 속도, 여러 나라 억양, 사진 문제까지 흔들림 없이 맞혀야 나와요. 4단계에 들어서면 실제 토익 시험을 한두 달 간격으로 직접 보면서 점수를 확인하세요. 시험 점수는 '기록'에 넣으면 단계가 자동으로 바뀌어요.</p></div>`;
}

// ================= 기록 =================
function viewStats(){
  const t=TODAY(), days=[];for(let d=t-13;d<=t;d++){const l=S.logs[d]||{w:0,q:0,m:0};days.push({d,act:l.w+l.q,m:l.m})}
  const maxA=Math.max(10,...days.map(x=>x.act)), W=640,H=180,P=28,bw=(W-P*2)/14;
  const bars=days.map((x,k)=>{const h=(H-P*2)*x.act/maxA;return `<rect x="${P+k*bw+4}" y="${H-P-h}" width="${bw-8}" height="${h}" rx="3" fill="var(--accent)"></rect><text x="${P+k*bw+bw/2}" y="${H-8}" text-anchor="middle">${dayStr(x.d)}</text>${x.act?`<text x="${P+k*bw+bw/2}" y="${H-P-h-4}" text-anchor="middle">${x.act}</text>`:""}`}).join("");
  const sc=S.scores.slice().sort((a,b)=>a.d-b.d);
  let chart="<p class='muted'>토익 점수를 입력하면 그래프가 그려져요.</p>";
  if(sc.length){const lo=Math.min(200,...sc.map(s=>s.s)),hi=990,x0=P+20,x1=W-P,y=v=>H-P-(H-P*2)*(v-lo)/(hi-lo),xs=k=>sc.length===1?(x0+x1)/2:x0+(x1-x0)*k/(sc.length-1);
    chart=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="토익 점수 변화">${[lo,800,hi].map(v=>`<line x1="${x0}" x2="${x1}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"></line><text x="${x0-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("")}
      <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${sc.map((s,k)=>xs(k)+","+y(s.s)).join(" ")}"></polyline>${sc.map((s,k)=>`<circle cx="${xs(k)}" cy="${y(s.s)}" r="${k===sc.length-1?6:4}" fill="var(--accent)"></circle><text x="${xs(k)}" y="${y(s.s)-10}" text-anchor="middle" style="fill:var(--ink)">${s.s}</text>`).join("")}</svg>`}
  const totalM=Object.values(S.logs).reduce((a,l)=>a+(l.m||0),0);
  const tags=Object.entries(S.tags).filter(([k,v])=>v.c+v.w>=2).map(([k,v])=>[k,v.c,v.w,Math.round(v.c/(v.c+v.w)*100)]).sort((a,b)=>a[3]-b[3]);
  $app.innerHTML=`<h2>기록</h2><div class="grid">
   <div class="card"><div class="muted">연속 공부</div><div class="big">${streak()}일</div></div>
   <div class="card"><div class="muted">오늘 공부</div><div class="big">${(S.logs[t]||{m:0}).m}분</div><div class="muted">누적 ${Math.floor(totalM/60)}시간 ${totalM%60}분</div></div>
   <div class="card"><div class="muted">원서 접수까지</div><div class="big">D-${dday()}</div></div></div>
   <div class="card" style="margin-top:12px"><h3>최근 14일 학습량 <span class="muted">(단어 + 문제)</span></h3><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="최근 14일 학습량">${bars}</svg></div>
   <div class="card" style="margin-top:12px"><h3>파트별 정답률</h3><table><tr><th>파트</th><th>정답률</th><th>푼 문제</th></tr>${Object.entries(PARTS).map(([k,P])=>{const v=S.parts[k];return `<tr><td>${esc(P.name)}</td><td>${v&&v.c+v.w?Math.round(v.c/(v.c+v.w)*100)+"%":"–"}</td><td>${v?v.c+v.w:0}</td></tr>`}).join("")}</table></div>
   <div class="card" style="margin-top:12px"><h3>유형별 약점 <span class="muted">(정답률 낮은 순)</span></h3>${tags.length?`<table><tr><th>유형</th><th>정답률</th><th>맞음/틀림</th></tr>${tags.slice(0,15).map(x=>`<tr><td>${esc(x[0])}</td><td><span class="pill ${x[3]>=90?"g":x[3]<60?"b":"w"}">${x[3]}%</span></td><td>${x[1]} / ${x[2]}</td></tr>`).join("")}</table>`:'<p class="muted">문제를 풀면 유형별 정답률이 쌓여요.</p>'}</div>
   <div class="card" style="margin-top:12px"><h3>토익 점수</h3>${chart}
   <div class="row" style="margin-top:10px"><input id="sd" type="date" aria-label="시험 날짜"><input id="ss" type="number" min="10" max="990" step="5" placeholder="점수" aria-label="점수" style="width:120px"><button class="btn" id="add">점수 추가</button></div>
   <div class="list" style="margin-top:10px">${sc.map((s,k)=>`<div class="row" style="justify-content:space-between"><span>${dayStr(s.d)} · <b>${s.s}점</b></span><button class="btn ghost sm" data-del="${k}">지우기</button></div>`).join("")}</div></div>`;
  document.getElementById("sd").valueAsDate=new Date();
  document.getElementById("add").onclick=()=>{const v=+document.getElementById("ss").value,dv=document.getElementById("sd").value;
    if(!(v>=10&&v<=990)){document.getElementById("ss").focus();return}
    const d=dv?Math.floor(new Date(dv+"T00:00:00Z").getTime()/86400000):t;S.scores.push({d,s:v});save();viewStats()};
  $app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const s=sc[+b.dataset.del];S.scores=S.scores.filter(x=>x!==s);save();viewStats()});
}

// ================= 오늘 =================
function viewHome(){
  const {due,fresh}=wordQueue(), t=TODAY(), l=S.logs[t]||{w:0,q:0,m:0,c:0};
  const nextU=UNITS.findIndex(u=>S.lessons[u.id]==null), wr=Object.keys(S.wrong).length, sc=curScore();
  const wt=weakTags(), lvl=LEVELS[S.level];
  const tasks=[
    [due.length+fresh.length>0,`단어 ${due.length+fresh.length}장`,"복습 "+due.length+" · 새 단어 "+fresh.length,"#words"],
    [nextU>=0,nextU>=0?`문법 ${nextU+1}단원 · ${UNITS[nextU].title}`:"문법 단원 모두 끝","설명 읽고 퀴즈, 부족하면 더 받기","#grammar"],
    [true,`파트5 새 문제 10개 (${lvl.name})`,wt.length?"약점: "+wt.join(", "):"문장 빈칸 채우기","#parts"],
    [true,`듣기 한 파트 (${lvl.name})`,"파트2 → 파트3 → 파트4 순서로 매일 하나","#parts"],
    [S.level>=1,"독해 파트7 한 세트","지문 근거 문장을 찾는 연습","#parts"],
    [wr>0,`오답 ${wr}문제`,"다시 맞히면 빠져요","#review"]
  ];
  $app.innerHTML=`<h2>오늘 할 일</h2>
   <div class="grid"><div class="card"><div class="muted">원서 접수까지</div><div class="big">D-${dday()}</div><div class="muted">2027년 12월 중순 예상</div></div>
   <div class="card"><div class="muted">목표</div><div class="big">${sc?sc+" → ":""}990</div><div class="muted">난이도 ${lvl.name} (${lvl.score})</div></div>
   <div class="card"><div class="muted">오늘 공부</div><div class="big">${l.m}분</div><div class="muted">단어 ${l.w} · 문제 ${l.q}${l.q?` (정답 ${Math.round((l.c||0)/l.q*100)}%)`:""} · 연속 ${streak()}일</div></div></div>
   <div class="list" style="margin-top:16px">${tasks.map(x=>`<a class="item" href="${x[3]}"><span><b>${esc(x[1])}</b><br><span class="muted">${esc(x[2])}</span></span><span class="pill ${x[0]?"":"g"}">${x[0]?"하기":"끝"}</span></a>`).join("")}</div>
   ${S.diag.length?"":`<div class="card" style="margin-top:16px"><h3>처음이라면 진단부터</h3><p class="muted">20문제로 지금 위치를 보고 난이도를 자동으로 맞춰요.</p><a class="btn" href="#diag">진단 테스트 하기</a></div>`}`;
}

// ================= 화면 전환 =================
const VIEWS={home:viewHome,roadmap:viewRoadmap,words:viewWords,grammar:viewGrammar,parts:viewParts,mock:viewMock,review:viewReview,diag:viewDiag,stats:viewStats};
function route(){busy=false;clearInterval(curTick);const h=(location.hash||"#home").slice(1),v=VIEWS[h]?h:"home";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+v));
  stopSpeak(); VIEWS[v](); window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
initStore();
})();
</script>
