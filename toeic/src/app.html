<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="토익 990">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>태빈 토익 독학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 한 권의 학습 노트: 흰 종이, 검정 글씨, 진한 청록은 '눌러야 할 것'에만 */
  --paper:#fcfcfa; --card:#ffffff; --ink:#000000; --sub:#4a4f52; --line:#d8dcdc;
  --accent:#1d5a66; --accent-soft:#e3eff1; --good:#2d7a4b; --good-soft:#e5f3ea; --bad:#b0281c; --bad-soft:#fbe9e7; --warn:#8a5a00; --warn-soft:#fbf1dc;
  --font:"Gowun Batang","MaruBuri","Nanum Myeongjo","AppleMyungjo",serif;
  --en:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6}
button{font-family:inherit;font-size:1rem;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 6px;max-width:960px;margin:0 auto}
.top h1{font-size:1.25rem;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.8rem;color:var(--sub);white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 16px 8px;max-width:960px;margin:0 auto}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ink);padding:8px 14px;border-radius:10px;font-size:.95rem}
nav a.on{background:var(--accent);color:#fff}
main{max-width:960px;margin:0 auto;padding:20px}
h2{font-size:1.4rem;margin:.2rem 0 1rem;text-wrap:balance}
h3{font-size:1.1rem;margin:0 0 .5rem;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.big{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.muted{color:var(--sub);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.bad{background:var(--bad);border-color:var(--bad)} .btn.good{background:var(--good);border-color:var(--good)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:default}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;text-decoration:none;color:inherit}
.pill{font-size:.8rem;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.g{background:var(--good-soft);color:var(--good)} .pill.b{background:var(--bad-soft);color:var(--bad)} .pill.w{background:var(--warn-soft);color:var(--warn)}
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.flash .w{font-size:2.6rem;font-weight:700;font-family:var(--en)}
.q{font-size:1.15rem;font-family:var(--en);margin:12px 0 14px}
.passage{font-family:var(--en);white-space:pre-wrap;background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-height:46vh;overflow:auto;margin:12px 0;font-size:1rem;line-height:1.65}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;text-align:left;min-height:52px;cursor:pointer;font-family:var(--en)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)}
.pic{border:1px solid var(--line);border-radius:12px;background:#fff;margin:14px 0;padding:6px}
.pic svg{display:block;width:100%;height:auto;max-height:340px}
.ex{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;white-space:pre-wrap}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent)}
ul.pts{padding-left:1.2rem;margin:.4rem 0 1rem} ul.pts li{margin:.3rem 0}
input,select{font-family:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
svg text{font-family:var(--font);fill:var(--sub);font-size:12px}
.en{font-family:var(--en)}
.sep{height:1px;background:var(--line);margin:18px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
table{border-collapse:collapse;width:100%} td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.stage{border-left:4px solid var(--line);padding-left:14px} .stage.now{border-left-color:var(--accent)} .stage.done{border-left-color:var(--good)}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.item{transition:background .15s,border-color .15s}}
.prdoc{background:#fff}
.prdoc h1{font-size:1.5em;margin:0 0 4px}
.prdoc h2{font-size:1.15em;margin:22px 0 6px;border-bottom:2px solid #000;padding-bottom:4px}
.prdoc table{width:100%;border-collapse:collapse;margin:8px 0}
.prdoc th,.prdoc td{border:1px solid #777;padding:5px 8px;text-align:left;font-size:.92em}
.prdoc ul{margin:6px 0;padding-left:20px}
.prdoc .wq{border:1px solid #777;border-radius:8px;padding:10px 12px;margin:10px 0;page-break-inside:avoid}
.prdoc .blank{color:#555;border-bottom:1px solid #999;display:inline-block;min-width:78%}
@media print{header,.noprint{display:none!important}body{background:#fff;color:#000;font-size:11.5pt}main{max-width:none;padding:0;margin:0}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>태빈 토익 독학 · 목표 990</h1><span class="chip" id="sync">저장 준비 중</span></div>
  <nav id="nav">
    <a href="#home">오늘</a><a href="#roadmap">로드맵</a><a href="#strategy">전략</a><a href="#export">굿노트</a><a href="#words">단어</a><a href="#grammar">문법</a><a href="#parts">파트별</a><a href="#mock">모의고사</a><a href="#review">오답노트</a><a href="#diag">진단</a><a href="#stats">기록</a>
  </nav>
</header>
<main id="app"></main>
<script>
/*DATA*/
</script>
<script>
(function(){
"use strict";
const $app=document.getElementById("app");
const DAILY_NEW=30, INT=[0,1,2,4,8,16,30], GOAL=990, APPLY=new Date(2027,11,15);
const L=["A","B","C","D"];
function dayNum(d){d=d||new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)}
function dayStr(n){const d=new Date(n*86400000);return (d.getUTCMonth()+1)+"/"+d.getUTCDate()}
const TODAY=()=>dayNum();
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function dday(){return Math.max(0,Math.ceil((APPLY-new Date())/86400000))}

// ================= 상태 =================
const BLANK=()=>({v:2,words:{},xw:[],wrong:{},solved:{},lessons:{},logs:{},scores:[],diag:[],tags:{},parts:{},level:0,mocks:[]});
let S=BLANK();
function fix(){const b=BLANK();for(const k in b)if(S[k]==null)S[k]=b[k];
  // v1 오답(문제 id만 있던 것)을 v2 형식으로
  for(const id in S.wrong){const w=S.wrong[id];if(!w.item&&QB[id])w.item=QB[id];if(!w.item)delete S.wrong[id]}}
function log(){const k=TODAY();S.logs[k]=S.logs[k]||{w:0,q:0,m:0,c:0};return S.logs[k]}
function streak(){let n=0,d=TODAY();if(!S.logs[d])d--;while(S.logs[d]&&(S.logs[d].w+S.logs[d].q+S.logs[d].m)>0){n++;d--}return n}

// ================= 기본 문제 묶음 =================
const QB={};
UNITS.forEach(u=>u.q.forEach((x,i)=>{QB["g:"+u.id+":"+i]={src:"문법 · "+u.title,part:"p5",tag:u.title,q:x[0],o:x[1],a:x[2],ex:x[3]}}));
PART5.forEach((x,i)=>{QB["p:"+i]={src:"파트5 · "+x[4],part:"p5",tag:x[4],q:x[0],o:x[1],a:x[2],ex:x[3]}});
LC.forEach((x,i)=>{QB["l:"+i]={src:"파트2",part:"p2",tag:"파트2",q:x[0],o:x[1],a:x[2],ex:x[3],say:[x[0]].concat(x[1].map((o,k)=>L[k]+". "+o))}});
const asSet=id=>({items:[Object.assign({id},QB[id])]});

// ================= 저장 =================
let ref=null, saving=false, dirty=false, timer=null;
const LS="tb-toeic-v1";
function setSync(t){document.getElementById("sync").textContent=t}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
async function readRef(r){const s=await r.get();if(!s)return null;if(typeof s.data==="function"){return s.exists===false?null:s.data()}if(s.data!==undefined)return s.data;return s}
function save(){lsSet();dirty=true;clearTimeout(timer);timer=setTimeout(flush,1500)}
async function flush(){
  if(!ref||saving||!dirty)return; saving=true; dirty=false; setSync("저장 중…");
  try{await ref.set({json:JSON.stringify(S),updated:Date.now()});setSync("계정에 저장됨")}
  catch(e){setSync("저장 실패 · 이 기기에만 저장");dirty=true}
  saving=false; if(dirty)timer=setTimeout(flush,3000);
}
function size(x){return x?Object.keys(x.logs||{}).length+Object.keys(x.words||{}).length+Object.keys(x.solved||{}).length:0}
async function initStore(){
  const l=lsGet(); if(l)S=Object.assign(BLANK(),l); fix(); setSync("이 기기에만 저장"); route();
  try{
    if(!window.claude||!window.claude.use)return;
    const to=new Promise(r=>setTimeout(()=>r(null),10000));
    const db=await Promise.race([window.claude.use("db"),to]);
    const user=await Promise.race([window.claude.use("user"),to]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    ref=db.collection("data/users/"+id).doc("toeic");
    const got=await readRef(ref);
    if(got&&got.json){const remote=JSON.parse(got.json);
      if(size(remote)>=size(lsGet())){S=Object.assign(BLANK(),remote);fix();lsSet()} else {dirty=true;flush()}}
    else {dirty=true;flush()}
    setSync("계정에 저장됨"); if(!busy)route();
  }catch(e){setSync("이 기기에만 저장")}
}

// ================= 소리 =================
let tts=null, voices=[];
(async()=>{try{if(window.claude&&window.claude.use)tts=await window.claude.use("tts")}catch(e){}})();
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang))}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function canSpeak(){return !!tts||("speechSynthesis" in window)}
function pickVoice(sp){if(!voices.length)return null;
  const us=voices.filter(v=>/en-US/i.test(v.lang)), pool=us.length>1?us:voices;
  const fem=pool.find(v=>/female|samantha|zira|aria|jenny|allison|ava|susan/i.test(v.name)), mal=pool.find(v=>/male|daniel|alex|fred|guy|david|tom/i.test(v.name)&&!/female/i.test(v.name));
  if(sp==="W")return fem||pool[0]; if(sp==="M")return mal||pool[Math.min(1,pool.length-1)]; return pool[0]}
function stopSpeak(){try{tts&&tts.stop()}catch(e){} try{speechSynthesis.cancel()}catch(e){}}
// lines: 문자열 또는 {sp:"M"|"W"|"N", t:"..."}
async function speak(lines){
  if(!Array.isArray(lines))lines=[lines];
  lines=lines.map(x=>typeof x==="string"?{sp:"N",t:x}:x);
  if(tts){try{await tts.speak(lines.map(x=>({text:x.t,language:"en",voice:x.sp==="W"?"airy":x.sp==="M"?"rounded":"buttery"})));return}catch(e){}}
  if("speechSynthesis" in window){speechSynthesis.cancel();
    lines.forEach(x=>{const u=new SpeechSynthesisUtterance(x.t);u.lang="en-US";u.rate=S.rate||.95;const v=pickVoice(x.sp);if(v)u.voice=v;speechSynthesis.speak(u)})}
}

// ================= 공부 시간 =================
let lastAct=Date.now();
["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{if(!document.hidden&&Date.now()-lastAct<120000){log().m++;save()}},60000);

// ================= Claude 문제 생성 =================
let sampleFn=null, sampleState="wait";
(async()=>{try{if(window.claude&&window.claude.use){sampleFn=await window.claude.use("sample")}}catch(e){} sampleState=sampleFn?"ok":"none"; if(!busy)route()})();
const LEVELS=[
 {name:"기초",score:"~450",desc:"아주 쉬운 어휘와 짧은 문장. 핵심 문법 하나만 묻는다. 오답 보기는 품사·형태가 확실히 다르다."},
 {name:"중급",score:"450~700",desc:"실제 토익 평균 난이도. 자주 나오는 비즈니스 어휘. 보기 두 개가 헷갈리게 만든다."},
 {name:"고급",score:"700~900",desc:"실제 토익의 어려운 문항 수준. 긴 문장, 수일치·관계사·도치·어휘 뉘앙스, 패러프레이즈."},
 {name:"만점",score:"900~990",desc:"실제 토익 최고 난도. 미묘한 어휘 구별, 함정 보기, 간접 응답(파트2), 추론·문장 삽입(파트7), 동의어 문제."}
];
const PARTS={
 p1:{name:"파트1 사진 묘사",lc:true,opts:4,short:"그림을 보고, 들리는 문장 4개 중 그림과 맞는 것을 고르기",
   spec:'세트 4개. 각 세트: "scene"=장면 묘사(한국어, 2~3문장, 사람·사물 위치와 동작을 구체적으로), "svg"=그 장면을 그린 SVG 일러스트 코드 문자열. <svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">로 시작해 사람·사물을 단순한 도형(rect, circle, line, path)과 단색으로 그린다. 글자(text), script, image, 애니메이션은 절대 넣지 않는다. "items"=[{"q":"","o":[영어 진술 4개],"a":정답,"ex":해설,"tag":"파트1"}]. 오답은 실제 토익처럼 동작 착오(-ing/수동 진행), 없는 사물 언급, 비슷한 소리 단어 함정.'},
 p2:{name:"파트2 질문·응답",lc:true,opts:3,short:"질문을 듣고 알맞은 응답 고르기 (보기 3개)",
   spec:'세트 1개, items 10개. 각 item: "q"=영어 질문이나 진술, "o"=영어 응답 3개, 정답 1개. 의문사·Yes/No·부탁·제안·평서문·간접 응답을 섞는다. 오답은 같은 단어 반복, 비슷한 소리, 엉뚱한 의문사 답 함정.'},
 p3:{name:"파트3 대화",lc:true,opts:4,short:"두세 사람 대화를 듣고 3문제",
   spec:'세트 2개. 각 세트: "audio"=[{"sp":"M"|"W","t":"영어 대사"}] 8~12줄의 업무 대화, "items"=3문제(목적·장소·세부·다음 행동·화자 의도 중), 각 4지선다(영어). 정답은 대화의 표현을 패러프레이즈해 둔다.'},
 p4:{name:"파트4 담화",lc:true,opts:4,short:"한 사람의 안내·광고·회의 담화를 듣고 3문제",
   spec:'세트 2개. 각 세트: "audio"=[{"sp":"M" 또는 "W","t":"..."}] 한 화자의 담화(공지, 광고, 전화 메시지, 회의 발췌, 투어 안내 등) 6~10문장, "items"=3문제 4지선다(영어). 화자 의도·시각 정보 대신 세부·추론 문제 포함.'},
 p5:{name:"파트5 문장 빈칸",lc:false,opts:4,short:"문장 빈칸 채우기 (문법·어휘)",
   spec:'세트 1개, items 10개. 각 item: "q"=빈칸을 ___ 로 표시한 영어 비즈니스 문장, "o"=4개, 문법(품사·시제·수일치·태·관계사·접속사/전치사·대명사·비교)과 어휘 문제를 섞는다.'},
 p6:{name:"파트6 장문 빈칸",lc:false,opts:4,short:"이메일·공지 지문의 빈칸 4개 (문장 삽입 포함)",
   spec:'세트 1개. "passage"=영어 이메일·공지·기사(120~180단어), 빈칸 4곳을 [1] [2] [3] [4]로 표시. "items"=4문제, q는 "Blank [1]" 형식, 4번 중 하나는 알맞은 문장 고르기(보기가 문장).'},
 p7:{name:"파트7 독해",lc:false,opts:4,short:"이메일·광고·기사 독해 (단일·이중 지문)",
   spec:'세트 2개. 각 세트: "passage"=영어 지문(첫 세트는 150~220단어 단일 지문, 둘째 세트는 이메일+공지 같은 이중 지문을 "--- Message 1 ---" 식으로 구분해 250~350단어), "items"=첫 세트 3문제, 둘째 세트 4문제(주제, 세부, 사실 확인 NOT true, 추론, 동의어 "closest in meaning", 문장 삽입 위치 [1]~[4] 중). 4지선다(영어).'}
};
function weakTags(){return Object.entries(S.tags).filter(([t,v])=>v.c+v.w>=3).map(([t,v])=>[t,v.w/(v.c+v.w)]).filter(x=>x[1]>=.34).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0])}
function promptFor(part,level,focus){
  const P=PARTS[part], Lv=LEVELS[level];
  return `너는 한국인 수험생을 위한 TOEIC 문제 출제자다. 실제 ETS 기출 문항을 그대로 베끼지 말고, 형식과 난이도만 실제 시험과 똑같은 새 문제를 만든다.
파트: ${P.name}
난이도: ${Lv.name} (목표 점수대 ${Lv.score}) — ${Lv.desc}
${focus&&focus.length?"특히 이 약점을 집중 출제: "+focus.join(", "):""}
만들 것: ${P.spec}

모든 문제 공통 규칙:
- 정답은 오직 하나. 정답 위치(a)는 0부터 시작하는 번호이며 세트마다 고르게 섞는다.
- "ex"는 한국어 해설. 반드시 ① 단서(빈칸 앞뒤·질문의 핵심어·지문 근거 문장) ② 정답 근거 ③ 각 오답이 틀린 이유를 단계별로 쓴다. 듣기 문제는 해설에 핵심 문장을 영어로 인용한다.
- "tag"는 짧은 한국어 유형명(예: 품사, 시제, 수일치, 능동/수동, 관계사, 접속사/전치사, 어휘, 대명사, 비교, 의문사 응답, 간접 응답, 세부 사항, 추론, 주제, 동의어, 문장 삽입, 화자 의도).
- 영어는 자연스러운 미국식 비즈니스 영어. 사람 이름·회사 이름은 가상으로.
- 출력은 JSON 하나만. 설명 문장, 코드 블록 표시 금지.
형식: {"sets":[{"scene":"(파트1만)","svg":"(파트1만)","passage":"(파트6·7만)","audio":[{"sp":"M","t":"..."}](파트3·4만),"items":[{"q":"...","o":["..."],"a":0,"ex":"...","tag":"..."}]}]}`;
}
function cleanSets(raw,part){
  const P=PARTS[part], out=[];
  const sets=(raw&&raw.sets)||[];
  sets.forEach(s=>{
    const items=(s.items||[]).filter(it=>it&&Array.isArray(it.o)&&it.o.length===P.opts&&Number.isInteger(+it.a)&&+it.a>=0&&+it.a<P.opts&&it.ex).map(it=>{
      const o={id:uid(),src:P.name,part,tag:String(it.tag||P.name).slice(0,20),q:String(it.q||""),o:it.o.map(String),a:+it.a,ex:String(it.ex)};
      if(part==="p1")o.say=it.o.map((x,k)=>L[k]+". "+x);
      if(part==="p2")o.say=[o.q].concat(it.o.map((x,k)=>L[k]+". "+x));
      return o});
    if(!items.length)return;
    const set={items};
    if(s.scene)set.scene=String(s.scene);
    if(s.svg)set.svg=String(s.svg);
    if(s.passage)set.passage=String(s.passage);
    if(Array.isArray(s.audio)&&s.audio.length)set.audio=s.audio.filter(a=>a&&a.t).map(a=>({sp:a.sp==="W"?"W":a.sp==="M"?"M":"N",t:String(a.t)}));
    if((part==="p3"||part==="p4")&&!set.audio)return;
    if((part==="p6"||part==="p7")&&!set.passage)return;
    out.push(set)});
  return out;
}
async function generate(part,level,focus,onStatus){
  if(!sampleFn)throw {code:"none"};
  onStatus&&onStatus("Claude가 문제를 만드는 중이에요…");
  let raw;
  try{raw=await sampleFn.json(promptFor(part,level,focus),{modelTier:part==="p7"||part==="p6"||level>=2?"complex":"default"})}
  catch(e){ // json 실패 시 text로 한 번 더
    if(e&&(e.code==="not_granted"||e.code==="rate_limited"))throw e;
    const r=await sampleFn(promptFor(part,level,focus)+"\nJSON 외의 글자는 절대 쓰지 마.",{modelTier:"default"});
    const t=(r&&r.text||"").replace(/^[^{]*/,"").replace(/[^}]*$/,""); raw=JSON.parse(t)}
  const sets=cleanSets(raw,part);
  if(!sets.length)throw {code:"empty"};
  return sets;
}
function genError(e){
  if(e&&e.code==="none")return "이 화면에서는 문제 생성 기능을 쓸 수 없어요. claude.ai에서 앱을 열면 돼요. 기본 문제는 그대로 풀 수 있어요.";
  if(e&&e.code==="not_granted")return "문제 생성 허락이 꺼져 있어요. 앱을 다시 열고 허락하면 쓸 수 있어요.";
  if(e&&e.code==="rate_limited")return "잠깐 너무 많이 만들었어요. 1~2분 뒤에 다시 눌러 주세요.";
  if(e&&e.code==="empty")return "만들어진 문제가 형식에 맞지 않아 버렸어요. 한 번만 다시 눌러 주세요.";
  return "문제를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.";
}

function svgSan(code){try{
  const d=new DOMParser().parseFromString(String(code),"image/svg+xml");
  if(d.querySelector("parsererror"))return null;
  const r=d.documentElement; if(!r||r.nodeName.toLowerCase()!=="svg")return null;
  r.querySelectorAll("script,foreignObject,image,use,a,iframe,animate,animateTransform,animateMotion,set,text").forEach(e=>e.remove());
  [r].concat(Array.from(r.querySelectorAll("*"))).forEach(e=>{Array.from(e.attributes).forEach(at=>{
    const n=at.name.toLowerCase(), v=String(at.value);
    if(n.indexOf("on")===0||n==="href"||n==="xlink:href"||/url\s*\(|javascript:|data:/i.test(v))e.removeAttribute(at.name)})});
  if(!r.getAttribute("viewBox"))r.setAttribute("viewBox","0 0 400 260");
  r.removeAttribute("width");r.removeAttribute("height");
  return new XMLSerializer().serializeToString(r)
}catch(e){return null}}
let busy=false, curTick=null;
// sets: [{scene?,passage?,audio?,items:[{id,src,part,tag,q,o,a,ex,say?}]}]
function runSets(sets,opt){
  opt=opt||{}; busy=true;
  const steps=[]; sets.forEach((s,si)=>s.items.forEach((it,ii)=>steps.push({s,it,first:ii===0})));
  let i=0,right=0,answered=0,limit=opt.seconds?Date.now()+opt.seconds*1000:0,tick=null;
  const res={};
  function finish(){
    clearInterval(tick); busy=false; stopSpeak();
    const total=steps.length;
    if(opt.mock){S.mocks.push({d:TODAY(),k:opt.mock,r:right,n:total});save()}
    $app.innerHTML=`<h2>${esc(opt.title||"문제")} 끝</h2><div class="card"><div class="big">${right} / ${total}</div>
     <p class="muted">${answered<total?`시간이 끝나 ${total-answered}문제는 풀지 못했어요. `:""}틀린 문제는 오답노트에 모였어요.</p>
     <div class="list">${Object.entries(res).map(([p,v])=>`<div class="row" style="justify-content:space-between"><span>${esc(PARTS[p]?PARTS[p].name:p)}</span><b>${v.r}/${v.n}</b></div>`).join("")}</div>
     <div class="row" style="margin-top:12px"><button class="btn" id="done">확인</button></div></div>`;
    document.getElementById("done").onclick=()=>{opt.onDone?opt.onDone(right,total):route()};
  }
  function timeStr(){if(!limit)return"";const s=Math.max(0,Math.round((limit-Date.now())/1000));return `<span class="timer${s<120?" low":""}" id="tm">${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}</span>`}
  if(limit)curTick=tick=setInterval(()=>{const el=document.getElementById("tm");const s=Math.max(0,Math.round((limit-Date.now())/1000));if(el){el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");el.classList.toggle("low",s<120)}if(s<=0)finish()},1000);
  function draw(){
    if(i>=steps.length)return finish();
    const {s,it}=steps[i], P=PARTS[it.part]||{}, isLC=!!P.lc;
    const hideText=isLC&&(it.part==="p1"||it.part==="p2");
    const showAudio=s.audio||it.say;
    if(s.svg&&s._svg===undefined)s._svg=svgSan(s.svg);
    const pic=s._svg||null;
    $app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(opt.title||"문제")}</h2><span class="row"><span class="muted">${i+1} / ${steps.length}</span>${timeStr()}</span></div>
      <div class="bar" style="margin-bottom:16px"><i style="width:${i/steps.length*100}%"></i></div>
      <div class="card"><div class="row" style="justify-content:space-between"><span class="pill">${esc(it.src)}${it.tag&&it.tag!==it.src?" · "+esc(it.tag):""}</span><button class="btn ghost sm" id="flag" title="이상한 문제 버리기">이상한 문제예요</button></div>
      ${pic?`<div class="pic">${pic}</div>`:s.scene?`<div class="ex" style="border-left-color:var(--warn);background:var(--warn-soft)"><b>장면</b> ${esc(s.scene)}</div>`:""}
      ${showAudio?`<div class="row" style="margin:14px 0"><button class="btn" id="play">▶ 듣기</button><button class="btn ghost" id="slow">▶ 천천히</button><button class="btn ghost" id="script">스크립트 보기</button></div><div id="scr" hidden class="passage"></div>`:""}
      ${s.passage?`<div class="passage">${esc(s.passage)}</div>`:""}
      ${hideText?"":`<p class="q">${esc(it.q).replace(/_{3,}/,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}</p>`}
      <div class="opts">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${L[k]}. <span class="ot"${hideText?" hidden":""}>${esc(o)}</span></button>`).join("")}</div>
      <div id="ex"></div></div>`;
    const lines=s.audio||it.say;
    function scriptText(){return (s.audio?s.audio.map(a=>(a.sp==="N"?"":a.sp+": ")+a.t).join("\n"):it.say.join("\n"))}
    if(showAudio){
      const pb=document.getElementById("play"), sb=document.getElementById("slow");
      if(!canSpeak()){pb.disabled=true;sb.disabled=true;pb.textContent="소리 없음"}
      pb.onclick=()=>{S.rate=.95;speak(lines)}; sb.onclick=()=>{S.rate=.75;speak(lines)};
      document.getElementById("script").onclick=()=>{const t=document.getElementById("scr");t.hidden=!t.hidden;t.textContent=scriptText()};
    }
    document.getElementById("flag").onclick=()=>{delete S.wrong[it.id];save();i++;draw()};
    $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if($app.querySelector(".opt.ok"))return;
      const k=+b.dataset.k, ok=k===it.a;
      answered++;
      $app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.k===it.a)o.classList.add("ok")});
      if(!ok)b.classList.add("no");
      $app.querySelectorAll(".ot").forEach(x=>x.hidden=false);
      const lg=log(); lg.q++; if(ok)lg.c++; S.solved[it.id]=1;
      const tg=S.tags[it.tag]||{c:0,w:0}; ok?tg.c++:tg.w++; S.tags[it.tag]=tg;
      const pp=S.parts[it.part]||{c:0,w:0}; ok?pp.c++:pp.w++; S.parts[it.part]=pp;
      res[it.part]=res[it.part]||{r:0,n:0}; res[it.part].n++;
      if(ok){right++;res[it.part].r++; if(opt.mode==="review")delete S.wrong[it.id]}
      else{const w=S.wrong[it.id]||{n:0}; w.n++; w.t=TODAY();
        w.item={id:it.id,src:it.src,part:it.part,tag:it.tag,q:it.q,o:it.o,a:it.a,ex:it.ex,say:it.say};
        w.ctx={scene:s.scene,passage:s.passage?s.passage.slice(0,2500):undefined,audio:s.audio};
        S.wrong[it.id]=w; trimWrong()}
      save();
      if(opt.mock&&!opt.explain){i++;draw();return}
      document.getElementById("ex").innerHTML=`<div class="ex"><strong>${ok?"맞았어요.":"틀렸어요. 정답은 "+L[it.a]+"."}</strong>\n${esc(it.ex)}${pic&&s.scene?`\n\n장면 설명: ${esc(s.scene)}`:""}</div><div class="row" style="margin-top:14px"><button class="btn" id="next">${i+1<steps.length?"다음":"결과 보기"}</button></div>`;
      if(showAudio){const t=document.getElementById("scr");t.hidden=false;t.textContent=scriptText()}
      document.getElementById("next").onclick=()=>{i++;draw();window.scrollTo(0,0)};
    });
  }
  draw();
}
function trimWrong(){const ks=Object.keys(S.wrong);if(ks.length>400){ks.sort((a,b)=>S.wrong[a].t-S.wrong[b].t).slice(0,ks.length-400).forEach(k=>delete S.wrong[k])}}

    function answer(ok){
      const t=TODAY(), key=wkey(i); let s=S.words[key]||{b:0,d:t,f:t};

const SKELETON_DOC=`<h1>영어 문장 뼈대 노트</h1>
<h2>1. 문장은 "누가 + 어쩐다"</h2>
<ul><li><b>주어(S)</b> = 누가·무엇이, <b>동사(V)</b> = 어쩐다·어떠하다. 이 둘이 뼈대고 나머지는 살이에요.</li>
<li>She arrived. → 그녀가(누가) 도착했다(어쩐다). 이것만으로 완전한 문장.</li></ul>
<h2>2. 동사의 성격이 뒤에 올 것을 정해요</h2>
<ul><li><b>혼자 끝나는 동사</b>: She arrived. / Prices increased.</li>
<li><b>대상이 필요한 동사</b> → 목적어(O): I read <b>the report</b>. 목적어는 주어와 <b>다른 것</b>.</li>
<li><b>설명이 필요한 동사</b> → 보어(C): He is <b>busy</b>. 보어는 주어와 <b>같은 상태</b>. (be, look, become, remain, keep)</li></ul>
<h2>3. 목적어 vs 보어 — 등호(=) 테스트</h2>
<ul><li>He is busy → He = busy (말이 됨) → <b>보어</b></li>
<li>I read the report → I = report? (말이 안 됨) → <b>목적어</b></li></ul>
<h2>4. 다섯 가지 모양 (5형식)</h2>
<table><tr><th>형식</th><th>모양</th><th>예문</th><th>뜻</th></tr>
<tr><td>1</td><td>S+V</td><td>She arrived.</td><td>그녀가 도착했다</td></tr>
<tr><td>2</td><td>S+V+C</td><td>He is busy.</td><td>그는 바쁘다</td></tr>
<tr><td>3</td><td>S+V+O</td><td>I read the report.</td><td>보고서를 읽었다</td></tr>
<tr><td>4</td><td>S+V+O+O</td><td>She gave me a pen.</td><td>나에게 + 펜을</td></tr>
<tr><td>5</td><td>S+V+O+C</td><td>The news made us happy.</td><td>우리를 = 행복하게</td></tr></table>
<h2>5. 품사와 성분은 달라요 (토익의 핵심)</h2>
<ul><li><b>품사</b> = 단어의 종류(명·동·형·부), <b>성분</b> = 문장에서의 자리(주어·동사·목적어·보어)</li>
<li>주어·목적어 자리엔 <b>명사</b>, 보어 자리엔 <b>형용사</b>(또는 명사). <b>부사는 보어가 못 돼요.</b></li>
<li>The office looks modernly ✗ → The office looks <b>modern</b> ✓</li></ul>
<h2>6. 파트5는 이 게임</h2>
<ul><li>빈칸의 <b>성분</b>을 보고 → 그 자리에 오는 <b>품사</b>를 고르면 끝. 뜻을 몰라도 풀리는 문제가 30% 이상.</li></ul>`;

  <p class="muted" style="margin-top:12px">홈 화면 앱에서 인쇄 화면이 안 열리면 Safari로 열어서 보내면 돼요. 단어를 더 받거나 오답이 늘면 다시 만들 때마다 최신 내용으로 나와요.</p>`;
  $app.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.x, html=k==="skeleton"?SKELETON_DOC:k==="grammar"?grammarDoc():k==="words"?wordsDoc():k==="wrong"?wrongDoc():STRATEGY_DOC;
    $app.innerHTML=`<div class="row noprint" style="justify-content:space-between;margin-bottom:14px"><button class="btn ghost" id="bk">← 돌아가기</button><button class="btn" id="pr">굿노트로 보내기 (인쇄)</button></div><div class="prdoc card">${html}</div>`;
    document.getElementById("bk").onclick=viewExport;
    document.getElementById("pr").onclick=()=>window.print();
    window.scrollTo(0,0);
  });
}

const VIEWS={home:viewHome,roadmap:viewRoadmap,strategy:viewStrategy,export:viewExport,words:viewWords,grammar:viewGrammar,parts:viewParts,mock:viewMock,review:viewReview,diag:viewDiag,stats:viewStats};
function route(){busy=false;clearInterval(curTick);const h=(location.hash||"#home").slice(1),v=VIEWS[h]?h:"home";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+v));
  stopSpeak(); VIEWS[v](); window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
initStore();
})();
</script>
